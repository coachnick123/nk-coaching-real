<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NT Coaching</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NT Coaching">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d13; --bg-2:#070a0f;
    --surface:#141a24; --surface-2:#1b2230; --surface-3:#222b3b;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --ink:#f3f6fb; --ink-2:#c3cbd8; --muted:#848e9f;
    --accent:#e7b34a; --accent-2:#f6cf73; --accent2:#e7b34a; --accent-ink:#2a1e00; --accent-soft:rgba(231,179,74,.14);
    --accent-line:rgba(231,179,74,.33); --accent-glow:rgba(231,179,74,.42);
    --good:#37d39a; --good-soft:rgba(55,211,154,.14);
    --warn:#f5c04e; --warn-soft:rgba(245,192,78,.14); --crit:#f2766a;
    --r:18px; --tight:-.02em;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 14px 30px -18px rgba(0,0,0,.9);
    --disp:"Hanken Grotesk",-apple-system,Segoe UI,Roboto,sans-serif;
    --sans:"Hanken Grotesk",-apple-system,Segoe UI,Roboto,sans-serif;
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 500px at 50% -8%, #11161f 0%, transparent 60%), #05070b}
  img{max-width:100%;display:block}
  button{font-family:inherit}
  .app{position:relative;max-width:468px;margin:0 auto;min-height:100%;
    background:linear-gradient(180deg,var(--bg),var(--bg-2));
    box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 40px 90px -40px #000;padding-bottom:104px}
  .app::before{content:"";position:absolute;top:0;left:0;right:0;height:340px;pointer-events:none;z-index:0;
    background:radial-gradient(440px 230px at 50% -50px, var(--accent-soft), transparent 70%)}
  .wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:linear-gradient(180deg,rgba(13,17,24,.96),rgba(13,17,24,.86));
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:12px;padding-block:13px}
  .mark{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);
    font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.5px;
    box-shadow:0 6px 16px -6px var(--accent)}
  .top .biz{font-family:var(--disp);font-size:11px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--accent-2)}
  .top .hi{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.2px;margin-top:-1px}
  .topr{margin-left:auto;display:flex;align-items:center;gap:8px}
  .iconbtn{width:38px;height:38px;border-radius:11px;flex:none;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
  .iconbtn svg{width:18px;height:18px}
  .chip{font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
  .chip.good{background:var(--good-soft);color:var(--good);border-color:rgba(55,211,154,.4)}
  .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(245,192,78,.4)}

  h1.screen{font-family:var(--disp);font-size:25px;font-weight:800;letter-spacing:-.4px;margin:20px 0 3px}
  .screensub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
  .eyebrow{font-family:var(--disp);font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .sect{display:flex;align-items:center;gap:9px;margin:22px 2px 11px}
  .sect .ic{width:17px;height:17px;color:var(--accent-2);flex:none}
  .sect h3{font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
  .sect .rule{height:1px;background:var(--line);flex:1;margin-left:4px}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 14px;border:1px dashed var(--line);border-radius:14px}

  .card{background:linear-gradient(180deg,var(--surface),var(--surface) 60%,#121824);
    border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .card + .card{margin-top:12px}

  .hero{position:relative;overflow:hidden;border:1px solid var(--accent-line);
    background:radial-gradient(130% 140% at 100% 0%, var(--accent-soft), transparent 55%),linear-gradient(180deg,var(--surface-2),var(--surface))}
  .herorow{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:90px;height:90px;flex:none;filter:drop-shadow(0 5px 18px var(--accent-glow))}
  .ring svg{width:90px;height:90px;display:block}
  .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .ringtxt b{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:var(--tight);font-variant-numeric:tabular-nums}
  .ringtxt span{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
  .herometa{min-width:0}
  .herometa .eyebrow{color:var(--accent-2)}
  .herometa .big{font-family:var(--disp);font-weight:900;font-size:31px;letter-spacing:-.5px;margin:4px 0 3px;font-variant-numeric:tabular-nums}
  .herometa .big i{font-style:normal;font-size:16px;font-weight:800;color:var(--accent-2);margin:0 7px 0 2px}
  .herometa .meta{color:var(--ink-2);font-size:12.5px}
  @keyframes rd{from{stroke-dashoffset:var(--c)}}
  .ring .rp{animation:rd 1.1s cubic-bezier(.4,0,.2,1) both}
  .showday{text-align:center;padding:22px 16px}
  .showday .big{font-family:var(--disp);font-weight:900;font-size:26px;color:var(--accent-2)}

  .kcal{display:flex;align-items:baseline;gap:9px}
  .kcal .n{font-family:var(--disp);font-weight:900;font-size:34px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .kcal .u{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
  .mbar{display:flex;height:9px;border-radius:6px;overflow:hidden;margin:14px 0 12px;background:#0c1017}
  .mbar i{display:block;height:100%}
  .mleg{display:flex;gap:7px}
  .mchip{flex:1;background:#0d1219;border:1px solid var(--line);border-radius:12px;padding:10px 11px}
  .mchip .k{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .mchip .k b{width:8px;height:8px;border-radius:50%}
  .mchip .v{font-family:var(--disp);font-weight:800;font-size:19px;margin-top:3px;font-variant-numeric:tabular-nums}
  .mchip .v small{font-size:11px;color:var(--muted);font-weight:600}

  .dn{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-.2px}
  .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .pill{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:4px 9px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-line)}
  .pill.cardio{background:rgba(242,118,106,.12);color:#ff9f94;border-color:rgba(242,118,106,.3)}
  .ex{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
  .ex:first-of-type{border-top:none}
  .ex .sr{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .demo{color:var(--accent-2);font-weight:700;font-size:11px;text-decoration:none;white-space:nowrap}
  .exd{border-top:1px solid var(--line)}
  .exd:first-of-type{border-top:none}
  .exd summary{list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13.5px;padding:9px 0;cursor:pointer}
  .exd summary::-webkit-details-marker{display:none}
  .exd .exn{display:flex;align-items:center;gap:7px;min-width:0}
  .exd .sr{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .exg-chip{font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--accent-2);border:1px solid var(--accent-line);border-radius:20px;padding:1px 6px;white-space:nowrap}
  .exd[open] summary .exg-chip{opacity:.5}
  .exg{padding:2px 0 12px;font-size:12.5px;color:var(--ink-2)}
  .exg-txt{margin-bottom:9px;line-height:1.55}
  .exg-watch{color:var(--accent-2);font-weight:700;text-decoration:none;font-size:12.5px}
  .logseg{display:flex;gap:7px;margin:14px 0 16px}
  .logseg button{flex:1;background:#0b0f16;border:1px solid var(--line);border-radius:11px;color:var(--muted);padding:11px 0;font-weight:800;font-family:var(--disp);font-size:13px;cursor:pointer}
  .logseg button.sel{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2)}
  .fl-row{margin:11px 0}
  .fl-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px}
  .fl-num{font-variant-numeric:tabular-nums}.fl-num small{color:var(--muted);font-weight:600}
  .fl-bar{height:8px;border-radius:5px;background:#0c1017;overflow:hidden}
  .fl-bar i{display:block;height:100%}
  .fl-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .fl-item:first-of-type{border-top:none}
  .fl-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fl-macros{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .fl-rm{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;flex:none}
  .sess-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .sess-item:first-child{border-top:none}
  .sess-when{font-weight:700;font-size:13.5px}
  .sess-lab{font-size:12px;color:var(--muted);margin-top:2px}
  .sess-btn{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);border:none;border-radius:10px;font-weight:800;font-family:var(--disp);font-size:12.5px;padding:9px 16px;cursor:pointer;flex:none}
  .sess-cancel{background:none;border:1px solid var(--line-2);color:var(--muted);border-radius:10px;font-weight:700;font-size:12px;padding:8px 14px;cursor:pointer;flex:none}
  details.sess-book{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
  details.sess-book summary{list-style:none;color:var(--accent-2);font-weight:700;font-size:13px;cursor:pointer;padding:7px 0}
  details.sess-book summary::-webkit-details-marker{display:none}
  .meal{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
  .meal + .meal{margin-top:13px}
  .meal .mn{font-family:var(--disp);font-weight:800;font-size:14px}
  .meal .mi{color:var(--ink-2);font-size:12.5px;margin:3px 0 4px}
  .meal .mm{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums}
  .meal-tap{cursor:pointer}
  .meal-tap:active{opacity:.6}
  .mtag{color:var(--accent);font-size:11px;font-weight:700}
  .mealov{position:fixed;inset:0;z-index:200;background:rgba(3,6,12,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
  .mealov-card{width:100%;max-width:468px;max-height:92vh;overflow-y:auto;background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);position:relative}
  .mealov-x{position:absolute;top:12px;right:12px;z-index:3;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center}
  .mealov-img{width:100%;height:230px;background-size:cover;background-position:center;background-color:var(--surface-2)}
  .mealov-body{padding:18px 18px calc(30px + env(safe-area-inset-bottom,0px))}
  .mealov-body h2{font-family:var(--disp);font-weight:900;font-size:22px;margin:0 0 10px}
  .mealov-body h3{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--accent-2);margin:16px 0 7px}
  .mdmac{display:flex;gap:8px;flex-wrap:wrap}
  .mdmac span{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .mdmac b{color:var(--ink);font-size:14px}
  .mdtext{color:var(--ink-2);font-size:14px;line-height:1.55;white-space:pre-wrap}
  .mdsteps{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px;line-height:1.5}
  .mdsteps li{margin-bottom:7px}
  a.pdfbtn,.pdfbtn{display:flex;align-items:center;gap:9px;background:var(--accent-soft);border:1px solid var(--accent-line);
    color:var(--accent-2);border-radius:12px;padding:12px 14px;font-weight:700;font-size:13.5px;margin-top:12px;cursor:pointer;text-decoration:none}
  .pdfbtn svg{width:17px;height:17px}

  .btn{display:block;width:100%;text-align:center;border:none;border-radius:13px;padding:14px;cursor:pointer;
    font-family:var(--disp);font-weight:800;font-size:14.5px;letter-spacing:.2px;
    background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);
    box-shadow:0 10px 24px -12px var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink);box-shadow:none}
  a.btn{text-decoration:none}
  label.fl{display:block;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:15px 0 7px}
  input,textarea,select{width:100%;background:#0b0f16;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:13px;font-size:15px;font-family:inherit}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input::placeholder,textarea::placeholder{color:#5a6472}
  textarea{min-height:76px;resize:vertical}
  .scale{display:flex;gap:7px}
  .scale button{flex:1;background:#0b0f16;border:1px solid var(--line);border-radius:11px;color:var(--muted);padding:12px 0;font-size:15px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s}
  .scale button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .trend{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .trend .cur{font-family:var(--disp);font-weight:900;font-size:32px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .trend .cur small{font-size:13px;color:var(--muted);font-weight:700}
  .delta{font-family:var(--disp);font-weight:800;font-size:13px;padding:3px 9px;border-radius:20px;font-variant-numeric:tabular-nums}
  .delta.down{background:var(--good-soft);color:var(--good)}
  .delta.up{background:var(--warn-soft);color:var(--warn)}
  .ci{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .ci:first-child{border-top:none}
  .ci .d{font-weight:700;font-size:13.5px}
  .ci .csub{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .ci .w{font-family:var(--disp);font-weight:800;color:var(--accent-2);font-size:17px;font-variant-numeric:tabular-nums}
  .quote{font-size:12.5px;color:var(--ink-2);padding:0 0 10px;font-style:italic}
  .gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .gal figure{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0d1219}
  .gal img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
  .gal figcaption{font-size:11px;color:var(--muted);padding:7px 9px;font-variant-numeric:tabular-nums}
  .galpick{cursor:pointer}
  .galpick.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .cmp2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cmp2 figure{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0d1219}
  .cmp2 img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
  .cmp2 figcaption{font-size:11px;color:var(--muted);padding:6px 8px;text-align:center}
  .cmp-gap{text-align:center;font-weight:800;font-family:var(--disp);color:var(--accent-2);margin-top:11px;font-size:15px}

  .logex{padding:11px 0;border-top:1px solid var(--line)}
  .logex:first-child{border-top:none}
  .logex .en{font-family:var(--disp);font-weight:800;font-size:14px;margin-bottom:8px}
  .logex .en small{color:var(--muted);font-weight:600;font-size:11px}
  .logset{display:flex;gap:8px;align-items:center;margin:5px 0}
  .logset .lbl{color:var(--muted);font-size:12px;min-width:12px;font-weight:700}
  .logset input{padding:9px}
  .prbadge{font-size:9.5px;font-weight:800;color:var(--good);background:var(--good-soft);border-radius:6px;padding:1px 6px;margin-left:6px}

  .htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hn{font-family:var(--disp);font-weight:800;font-size:15.5px}
  .hg{font-size:12px;color:var(--muted);margin-top:2px}
  .streak{font-family:var(--disp);font-weight:800;font-size:14px;color:var(--accent-2);white-space:nowrap}
  .hweek{display:flex;gap:7px;margin:13px 0}
  .hdot{flex:1;aspect-ratio:1;max-width:19px;border-radius:7px;background:#0c1017;border:1px solid var(--line)}
  .hdot.on{background:linear-gradient(145deg,var(--accent-2),var(--accent));border-color:transparent}
  .hlog{display:flex;gap:9px}.hlog input{flex:1}
  .hmet{font-size:12px;margin-top:9px;color:var(--muted)}.hmet.yes{color:var(--good);font-weight:700}
  .btn.hdone{background:var(--good-soft);border:1px solid rgba(55,211,154,.5);color:var(--good);box-shadow:none}

  .thread{display:flex;flex-direction:column;gap:9px;margin-bottom:13px}
  .chatfull{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:468px;z-index:15;display:flex;flex-direction:column;background:var(--bg)}
  .chatfull .chatscroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:calc(74px + env(safe-area-inset-top,0px)) 16px 14px}
  .chatfull .chatinput{display:flex;gap:9px;align-items:center;padding:10px 16px calc(82px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 42%)}
  .chatfull .chatinput input{flex:1}
  .chatfull .chatinput .btn{width:46px;flex:none;padding:0;height:46px;display:grid;place-items:center}
  .chatfull .chatinput .btn svg{width:19px;height:19px}
  .bubwrap{display:flex;flex-direction:column;max-width:86%}
  .bubwrap.me{align-self:flex-end;align-items:flex-end}
  .bubwrap.them{align-self:flex-start;align-items:flex-start}
  .bub{max-width:100%;padding:10px 13px;border-radius:15px;font-size:14px;word-wrap:break-word}
  .bub.coach{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bub.client{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-bottom-right-radius:5px;font-weight:600}

  /* ---------- PROGRESS ---------- */
  function sparkline(arr){
    const W=320,H=96,pad=6, min=Math.min(...arr), max=Math.max(...arr), rng=(max-min)||1;
    const xs=i=>pad+i*((W-pad*2)/(arr.length-1)), ys=v=>pad+(1-(v-min)/rng)*(H-pad*2-14)+2;
    const pts=arr.map((v,i)=>[xs(i),ys(v)]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=line+` L ${xs(arr.length-1).toFixed(1)} ${H-pad} L ${pad} ${H-pad} Z`;
    const last=pts[pts.length-1];
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">
      <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.32"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
      <path d="${area}" fill="url(#wg)"/>
      <path d="${line}" fill="none" stroke="var(--accent-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.2" fill="var(--accent-2)" stroke="#0a0d13" stroke-width="2.5"/>
    </svg>`;
  }

    </div>`;

    if(!posts.length) h+='<div class="empty" style="border:none;margin:auto">No posts yet. Start the conversation!</div>';
    posts.forEach(p=>{const mine=p.author_role==='client';h+=`<div class="bubwrap ${mine?'me':'them'}"><div class="bub ${mine?'client':'coach'}"><div class="who">${esc(p.author_name||(p.author_role==='coach'?'Coach':'Member'))}</div>${esc(p.text)}</div><button class="likebtn ${p.liked?'liked':''}" data-like-post="${p.id}"><span class="hrt">${p.liked?'♥':'♡'}</span>${p.likes?('<span>'+p.likes+'</span>'):''}</button></div>`;});
    h+=`</div><div class="chatinput"><input id="grp_in" placeholder="Post to the group…"><button class="btn" id="grp_send">${svg(I.send)}</button></div></div>`;
    return h;
  }

  /* ---------- HABITS ---------- */
  async function habitsView(){
    let habits=[];try{habits=await rpc('client_portal_habits',{p_code:code});}catch(e){}
    let h=`<h1 class="screen">Daily Habits</h1><div class="screensub">Tick these off each day — keep the streak alive.</div>`;
    if(!habits.length) return h+'<div class="empty">Your coach hasn’t set any habits yet. They’ll show up here.</div>';
    habits.forEach(ht=>{
      const tgt = (ht.target!=null && ht.target!=='') ? Number(ht.target) : null;
      const todayVal = ht.today!=null ? Number(ht.today) : 0;
      const met = tgt!=null ? todayVal>=tgt : todayVal>0;
      const wk=(ht.week||[]).map(d=>{const v=Number(d.value)||0;const m=tgt!=null?v>=tgt:v>0;return `<span class="hdot ${m?'on':''}"></span>`;}).join('');
      h+=`<div class="card"><div class="htop"><div><div class="hn">${esc(ht.name)}</div>${tgt!=null?`<div class="hg">Goal: ${tgt} ${esc(ht.unit||'')}/day</div>`:''}</div><div class="streak">🔥 ${ht.streak||0}</div></div><div class="hweek">${wk}</div>`;
      if(tgt!=null){
        h+=`<div class="hlog"><input type="number" step="any" inputmode="decimal" id="hv_${ht.id}" value="${todayVal||''}" placeholder="today's ${esc(ht.unit||'amount')}"><button class="btn" style="width:auto;padding:13px 18px;margin:0" data-hsave="${ht.id}">Save</button></div>
          <div class="hmet ${met?'yes':''}">${met?'✓ Goal hit today':'Log today’s amount to hit your goal'}</div>`;
      } else {
        h+=`<button class="btn ${met?'hdone':'ghost'}" data-htoggle="${ht.id}" data-on="${met?1:0}">${met?'✓ Done today':'Mark done today'}</button>`;
      }
      h+='</div>';
    });
    return h;
  }

  // ---------- FOOD LOG ----------
  async function foodView(){
    const today=new Date().toISOString().slice(0,10);
    let day={entries:[],totals:{calories:0,protein:0,carbs:0,fat:0}};
    try{ day=await rpc('client_portal_food_day',{p_code:code,p_date:today}); }catch(e){}
    const mp=(plan&&plan.meal_plan)||{};
    const T={calories:mp.target_calories||0,protein:mp.target_protein||0,carbs:mp.target_carbs||0,fat:mp.target_fat||0};
    const tot=day.totals||{calories:0,protein:0,carbs:0,fat:0};
    const bar=(got,tgt,color,lab,unit)=>{
      const g=Math.round(Number(got)||0), pct=tgt?Math.min(100,Math.round(g/tgt*100)):0;
      return `<div class="fl-row"><div class="fl-top"><span>${lab}</span><span class="fl-num">${g}${tgt?` <small>/ ${tgt}${unit}</small>`:unit}</span></div><div class="fl-bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
    };
    let h=`<div class="screensub" style="margin-top:2px">Today · ${fmtDate(today)} — log what you eat and watch it stack up against your targets.</div>`;
    h+=`<div class="card">
      ${bar(tot.calories,T.calories,'linear-gradient(90deg,var(--accent-2),var(--accent))','Calories',' kcal')}
      ${bar(tot.protein,T.protein,'var(--accent)','Protein','g')}
      ${bar(tot.carbs,T.carbs,'#5aa0ff','Carbs','g')}
      ${bar(tot.fat,T.fat,'#c58bff','Fat','g')}
    </div>`;
    h+=`<div class="card">
      <label class="fl">Add food</label>
      <input type="text" id="fd_name" placeholder="e.g. Chicken & rice">
      <div style="display:flex;gap:8px;margin-top:8px">
        <input type="number" id="fd_cal" placeholder="kcal" inputmode="numeric">
        <input type="number" id="fd_pro" placeholder="P (g)" inputmode="decimal">
        <input type="number" id="fd_carb" placeholder="C (g)" inputmode="decimal">
        <input type="number" id="fd_fat" placeholder="F (g)" inputmode="decimal">
      </div>
      <button class="btn" id="fd_add" style="margin-top:12px">+ Add to today</button>
    </div>`;
    if((day.entries||[]).length){
      h+=`<div class="card"><label class="fl">Today's food</label>${day.entries.map(e=>`<div class="fl-item"><div style="min-width:0"><div class="fl-name">${esc(e.name)}</div><div class="fl-macros">${e.calories?e.calories+' kcal · ':''}P ${e.protein||0} · C ${e.carbs||0} · F ${e.fat||0}</div></div><button class="fl-rm" data-rm-food="${e.id}">✕</button></div>`).join('')}</div>`;
    } else {
      h+=`<div class="empty">Nothing logged yet today.</div>`;
    }
    return h;
  }
  async function logTabView(){
    const seg=`<h1 class="screen">Log</h1><div class="logseg"><button data-logmode="workout" class="${logMode==='workout'?'sel':''}">🏋️ Workout</button><button data-logmode="food" class="${logMode==='food'?'sel':''}">🍽️ Food</button></div>`;
    return seg + (logMode==='food' ? await foodView() : await workoutView());
  }
  const views={plan:planView,checkin:checkinView,habits:habitsView,progress:progressView,workout:logTabView,messages:messagesView,community:communityView};
  async function render(){
    let inner='';
    try{ inner = await views[view.tab](); }catch(e){ inner='<div class="empty">Something went wrong loading this. Pull to refresh.</div>'; }
    app.innerHTML = topbar()+`<div class="wrap" style="padding-top:2px">${inner}</div>`+tabbar();
    wire();
  }

  function wire(){
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{view.tab=b.getAttribute('data-tab');ci={strength:0,hunger:0,energy:0};cq={};window.scrollTo(0,0);render();});
    const th=document.getElementById('tourHelp'); if(th) th.onclick=startTour;
    document.querySelectorAll('[data-logmode]').forEach(b=>b.onclick=()=>{logMode=b.getAttribute('data-logmode');render();});
    const fda=document.getElementById('fd_add');
    if(fda) fda.onclick=async()=>{
      const name=document.getElementById('fd_name').value.trim();
      const num=id=>{const v=document.getElementById(id).value;return v===''?null:Number(v);};
      if(!name){toast('Add a food name');return;}
      fda.disabled=true;
      try{ await rpc('client_portal_log_food',{p_code:code,p_name:name,p_calories:num('fd_cal'),p_protein:num('fd_pro'),p_carbs:num('fd_carb'),p_fat:num('fd_fat'),p_date:new Date().toISOString().slice(0,10)}); me.account_status='active'; toast('Added ✅'); render(); }
      catch(e){ fda.disabled=false; toast('Error: '+(e.message||'try again')); }
    };
    document.querySelectorAll('[data-rm-food]').forEach(b=>b.onclick=async()=>{
      try{ await rpc('client_portal_remove_food',{p_code:code,p_entry_id:b.getAttribute('data-rm-food')}); render(); }catch(e){toast('Error');}
    });
    document.querySelectorAll('[data-book-slot]').forEach(b=>b.onclick=async()=>{
      try{ await rpc('client_portal_book_slot',{p_code:code,p_slot_id:b.getAttribute('data-book-slot')}); me.account_status='active'; toast('Session booked ✅'); render(); }
      catch(e){ toast(e.message||'Could not book'); render(); }
    });
    document.querySelectorAll('[data-cancel-slot]').forEach(b=>b.onclick=async()=>{
      try{ await rpc('client_portal_cancel_booking',{p_code:code,p_slot_id:b.getAttribute('data-cancel-slot')}); toast('Booking cancelled'); render(); }
      catch(e){ toast('Error'); }
    });
    document.querySelectorAll('[data-cmp]').forEach(b=>b.onclick=()=>{
      const p=photoList[+b.getAttribute('data-cmp')]; if(!p||!p.storage_path) return;
      const idx=cmpSel.findIndex(c=>c.src===p.storage_path);
      if(idx>=0) cmpSel.splice(idx,1); else { if(cmpSel.length>=2) cmpSel.shift(); cmpSel.push({src:p.storage_path,date:p.date}); }
      render();
    });
    const cmpc=document.getElementById('cmpClear'); if(cmpc) cmpc.onclick=()=>{cmpSel=[];render();};
    document.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>{const k=b.getAttribute('data-scale');ci[k]=+b.getAttribute('data-v');document.querySelectorAll('[data-scale="'+k+'"]').forEach(x=>x.classList.toggle('sel',x===b));});
    document.querySelectorAll('[data-cq]').forEach(b=>b.onclick=()=>{const k=b.getAttribute('data-cq');cq[k]=+b.getAttribute('data-v');document.querySelectorAll('[data-cq="'+k+'"]').forEach(x=>x.classList.toggle('sel',x===b));});
    const cis=document.getElementById('ci_submit');
    if(cis) cis.onclick=async()=>{
      const weight=parseFloat(document.getElementById('ci_weight').value)||null;
      const adh=document.getElementById('ci_adh').value===''?null:parseInt(document.getElementById('ci_adh').value);
      const notes=document.getElementById('ci_notes').value.trim();
      const num=id=>{const el=document.getElementById(id);const v=el?el.value:'';return v===''?null:Number(v);};
      const steps=num('ci_steps'), cardio=num('ci_cardio'), waist=num('ci_waist'), hips=num('ci_hips'), chest=num('ci_chest');
      const answers=checkinQs.map(q=> q.qtype==='scale' ? {question_id:q.id, num:cq[q.id]||null} : {question_id:q.id, text:(document.getElementById('q_'+q.id)?(document.getElementById('q_'+q.id).value||'').trim():'')});
      if(weight==null && !ci.strength && !notes && steps==null && cardio==null){toast('Add at least your weight or a note');return;}
      cis.disabled=true;cis.textContent='Saving…';
      try{ await rpc('client_portal_submit_checkin',{p_code:code,p_weight:weight,p_strength:ci.strength||null,p_hunger:ci.hunger||null,p_energy:ci.energy||null,p_adherence:adh,p_notes:notes||null,p_steps:steps,p_cardio_min:cardio,p_waist:waist,p_hips:hips,p_chest:chest,p_answers:answers});
        me.account_status='active'; toast('Check-in sent ✅'); view.tab='progress'; render();
      }catch(e){cis.disabled=false;cis.textContent='Submit Check-In';toast('Error: '+(e.message||'try again'));}
    };
    const phs=document.getElementById('ph_submit');
    if(phs) phs.onclick=()=>{
      const f=document.getElementById('ph_file').files[0];
      if(!f){toast('Choose a photo first');return;}
      if(f.size>5*1024*1024){toast('Photo too large (max 5MB)');return;}
      const note=document.getElementById('ph_note').value.trim();
      const r=new FileReader();phs.disabled=true;phs.textContent='Uploading…';
      r.onload=async()=>{try{await rpc('client_portal_submit_photo',{p_code:code,p_date:new Date().toISOString().slice(0,10),p_photo_data:r.result,p_note:note||null});me.account_status='active';toast('Photo uploaded 📸');render();}catch(e){phs.disabled=false;phs.textContent='Upload Photo';toast('Error: '+(e.message||'try again'));}};
      r.readAsDataURL(f);
    };
    const ld=document.getElementById('log_day');
    if(ld) ld.onchange=()=>{logDayIdx=+ld.value;render();};
    const ls=document.getElementById('log_submit');
    if(ls) ls.onclick=async()=>{
      const w=plan.workout, days=w.days.filter(d=>(d.exercises||[]).length), day=days[logDayIdx];
      const exs=day.exercises.map((e,ei)=>{const sets=[];for(let s=1;s<=3;s++){const wv=document.querySelector(`input[data-ex="${ei}"][data-set="${s}"][data-k="weight"]`).value;const rv=document.querySelector(`input[data-ex="${ei}"][data-set="${s}"][data-k="reps"]`).value;if(wv||rv)sets.push({weight:wv,reps:rv});}return {name:e.name,sets};}).filter(e=>e.sets.length);
      if(!exs.length){toast('Log at least one set');return;}
      ls.disabled=true;ls.textContent='Saving…';
      try{await rpc('client_portal_submit_workout_log',{p_code:code,p_day_name:day.name,p_date:new Date().toISOString().slice(0,10),p_exercises:exs});me.account_status='active';toast('Workout saved 🏋️');render();}catch(e){ls.disabled=false;ls.textContent='Save Workout';toast('Error: '+(e.message||'try again'));}
    };
    const send=document.getElementById('msg_send');
    if(send){const input=document.getElementById('msg_in');const thr=document.getElementById('thread');if(thr)thr.scrollTop=thr.scrollHeight;
      const go=async()=>{const t=input.value.trim();if(!t)return;input.value='';try{await rpc('client_portal_send_message',{p_code:code,p_text:t});render();}catch(e){toast('Error sending');}};
      send.onclick=go;input.onkeydown=e=>{if(e.key==='Enter')go();};}
    const gs=document.getElementById('grp_send');
    if(gs){const input=document.getElementById('grp_in');const gthr=document.getElementById('thread');if(gthr)gthr.scrollTop=gthr.scrollHeight;const go=async()=>{const t=input.value.trim();if(!t)return;input.value='';try{await rpc('client_portal_group_post',{p_code:code,p_text:t});render();}catch(e){toast('Error posting');}};
      gs.onclick=go;input.onkeydown=e=>{if(e.key==='Enter')go();};}
    const thrEl=document.getElementById('thread');
    if(thrEl)thrEl.addEventListener('click',async e=>{
      const mb=e.target.closest('[data-like-msg]'), pb=e.target.closest('[data-like-post]');
      if(!mb&&!pb)return;
      try{
        if(mb){await rpc('client_portal_toggle_message_like',{p_code:code,p_message_id:mb.getAttribute('data-like-msg')});}
        else{await rpc('client_portal_toggle_group_like',{p_code:code,p_post_id:pb.getAttribute('data-like-post')});}
        render();
      }catch(err){toast('Error');}
    });
    document.querySelectorAll('[data-meal-idx]').forEach(el=>el.onclick=()=>openMealDetail(+el.getAttribute('data-meal-idx')));
    const today=new Date().toISOString().slice(0,10);
    document.querySelectorAll('[data-htoggle]').forEach(b=>b.onclick=async()=>{
      const id=b.getAttribute('data-htoggle'); const on=b.getAttribute('data-on')==='1';
      try{await rpc('client_portal_log_habit',{p_code:code,p_habit_id:id,p_date:today,p_value:on?0:1});render();}catch(e){toast('Error');}
    });
    document.querySelectorAll('[data-hsave]').forEach(b=>b.onclick=async()=>{
      const id=b.getAttribute('data-hsave'); const v=parseFloat(document.getElementById('hv_'+id).value)||0;
      try{await rpc('client_portal_log_habit',{p_code:code,p_habit_id:id,p_date:today,p_value:v});render();toast(v>0?'Logged ✅':'Cleared');}catch(e){toast('Error');}
    });
  }

  /* ---------- WELCOME TOUR ---------- */
  const TOUR_KEY='nt_tour_v2_'+(code||'');
  let tourIdx=0;
  function tourSlides(){
    const first=(me.name||'there').split(' ')[0], biz=me.business_name||'your coach';
    return [
      {ic:I.group,t:`Welcome, ${esc(first)}!`,b:`This is your ${esc(biz)} home base — everything in one place. Here's the 20-second tour.`},
      {ic:I.plan,t:'Your Plan',b:'Your meal targets and training split live here, kept up to date by your coach.'},
      {ic:I.check,t:'Weekly Check-In',b:'Send your weekly update in about 30 seconds — your coach sees it right away.'},
      {ic:I.flame,t:'Habits & Progress',b:'Build daily streaks and watch your weight trend and photos over time.'},
      {ic:I.chat,t:'Stay Connected',b:"Message your coach 1-on-1, or hype up the crew in the Group tab. Let's go!"}
    ];
  }
  function renderTour(){
    const slides=tourSlides(), s=slides[tourIdx], last=tourIdx===slides.length-1;
    document.getElementById('tourHost').innerHTML=`<div class="tour-ov"><div class="tour-card">
      <div class="tour-ic">${svg(s.ic)}</div><h2>${esc(s.t)}</h2><p>${esc(s.b)}</p>
      <div class="tdots">${slides.map((_,i)=>`<span class="${i===tourIdx?'on':''}"></span>`).join('')}</div>
      <div class="tnav">${tourIdx>0?'<button class="btn ghost" id="tourBack" style="flex:1">Back</button>':''}<button class="btn" id="tourNext" style="flex:2">${last?"Let's go 🎯":'Next'}</button></div>
      ${!last?'<button class="tskip" id="tourSkip">Skip tour</button>':''}
    </div></div>`;
    document.getElementById('tourNext').onclick=()=>{ if(last) endTour(); else { tourIdx++; renderTour(); } };
    const bk=document.getElementById('tourBack'); if(bk) bk.onclick=()=>{ tourIdx--; renderTour(); };
    const sk=document.getElementById('tourSkip'); if(sk) sk.onclick=endTour;
  }
  function startTour(){ tourIdx=0; renderTour(); }
  function endTour(){ try{localStorage.setItem(TOUR_KEY,'1');}catch(e){} const h=document.getElementById('tourHost'); if(h) h.innerHTML=''; }
  function maybeShowTour(){ let seen=false; try{seen=localStorage.getItem(TOUR_KEY)==='1';}catch(e){} if(!seen) startTour(); }

  boot();
})();
</script>
</body>
