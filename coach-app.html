<style>

  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }

  .btn-ghost { background:transparent; border-color:var(--border); color:var(--ink); }
  .btn-primary { background:var(--accent); color:#fff; font-weight:700; }

  .container { max-width:1180px; margin:0 auto; padding:24px 24px 72px; }

  .search { position:relative; flex:1; min-width:180px; }
  .search input { padding-left:36px; }
  .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted); pointer-events:none; }
  .toolbar select { width:auto; min-width:150px; }

  /* ---- Stat cards ---- */
  .statgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .statcard { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }

  .statcard .big small { font-size:18px; color:var(--muted); font-weight:700; }
  .statcard .foot { font-size:12px; color:var(--ink-2); margin-top:8px; }
  .statcard.good .big { color:var(--good); }
  .statcard.warn .big { color:var(--warn); }
  .statcard.accent .big { color:var(--accent-strong); }

  /* ---- Roster table ---- */
  .roster { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .roster-head, .roster-row { display:grid; grid-template-columns:2.3fr 1fr 1.5fr 1.2fr 1.1fr 26px; align-items:center; gap:14px; padding:14px 20px; }
  .roster-head { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); border-bottom:1px solid var(--border); }
  .roster-row { border-top:1px solid var(--border); width:100%; text-align:left; background:none; color:inherit; font:inherit; cursor:pointer; }
  .roster-row:first-of-type { border-top:none; }

  .cell-client { display:flex; align-items:center; gap:12px; min-width:0; }
  .avatar { width:34px; height:34px; border-radius:50%; background:var(--surface-sunken); color:var(--ink-2); display:flex; align-items:center; justify-content:center; font-family:"Archivo",sans-serif; font-weight:700; font-size:13px; flex-shrink:0; }
  .cell-name { font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .newbadge { display:inline-block; background:var(--info-soft); color:var(--info); font-size:10px; font-weight:700; padding:1px 7px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .cell-weight { font-weight:700; font-size:15px; }

  .cell-check { font-size:13.5px; color:var(--ink-2); }
  .chev { color:var(--muted); justify-self:end; }
  @media (max-width:780px) {
    .roster-head { display:none; }
    .roster-row { grid-template-columns:minmax(0,1fr) auto auto; grid-auto-rows:auto; gap:10px; padding:14px 16px; }
    .roster-row .cell-trend, .roster-row .cell-check, .roster-row .chev { display:none; }

  /* ---- Modal ---- */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.66); display:flex; align-items:flex-start; justify-content:center; padding:56px 16px; z-index:50; overflow:auto; }

  .warn-banner { background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:12px 16px; font-size:13px; font-weight:600; margin-bottom:18px; }

  .macro-tile .n { font-family:"Archivo",sans-serif; font-weight:800; font-size:15px; }

  setTimeout(() => t.classList.remove('show'), 2600);
}
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
function setKeyInUrl(k) {
  const url = new URL(window.location.href);
  url.searchParams.set('key', k);
  window.history.replaceState({}, '', url.toString());
}
function fmtMoney(n) { return '$' + Math.round(Number(n)).toLocaleString('en-US'); }
function applyAccent(accentId) {
  const c = ACCENT_COLORS[accentId] || ACCENT_COLORS.gold;
  document.documentElement.style.setProperty('--accent', c.base);
  document.documentElement.style.setProperty('--accent-strong', c.strong);
}
function brandMark() {
  return `<img class="brand-logo" src="${LOGO_URL}" alt="NT Coaching">`;
}
function initialsOf(name) {
  const parts = (name || '').trim().split(/\s+/);
  return ((parts[0]||'?')[0] + (parts[1]? parts[1][0] : '')).toUpperCase();
}
function daysAgo(dateStr) {
  if (!dateStr) return null;
  return Math.floor((Date.now() - new Date(dateStr + 'T00:00:00').getTime()) / 86400000);
}
function relDate(dateStr) {
  const d = daysAgo(dateStr);
  if (d === null) return '—';
  if (d <= 0) return 'Today';
  if (d === 1) return 'Yesterday';
  if (d < 7) return d + ' days ago';
  if (d < 14) return 'Last week';
  return Math.floor(d/7) + ' weeks ago';
}

window.addEventListener('unhandledrejection', e => toast('Error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason))));

/* ================= REMINDERS + CELEBRATIONS ================= */
const REMINDER_RULES = {
  attention: { label: 'Needs Attention', trigger: '9–13 days since last check-in', msg: n => `Hey ${n}, just checking in — haven't seen your weekly check-in yet. No pressure, just want to make sure you're good!` },
  overdue: { label: 'Overdue Check-In', trigger: '14+ days since last check-in', msg: n => `Hey ${n}, it's been a couple weeks since your last check-in. Let's get you back on track — send over your numbers whenever you get a chance, even if it's not your best week.` },
  'low-adherence': { label: 'Low Adherence', trigger: 'adherence scored 4 or below', msg: n => `Hey ${n}, saw adherence was a bit lower this week — totally normal, everyone has those. What got in the way? Let's figure out a plan that fits your week better.` },
  streak: { label: 'Streak Shoutout', trigger: '4+ check-ins in a row with adherence 8+', msg: (n, s) => `Hey ${n}, you've been crushing it lately — ${s} strong check-ins in a row with great adherence. Proud of the consistency, keep it up!` },
};
function dueRulesFor(c) {
  const due = [];
  const age = daysAgo(c.last_checkin_date);
  if (age !== null) {
    if (age >= 9 && age <= 13) due.push('attention');
    if (age >= 14) due.push('overdue');
  }
  if (c.last_adherence !== null && c.last_adherence <= 4) due.push('low-adherence');
  const recent = c.recent_adherence || [];
  if (c.checkin_count >= 4 && recent.length >= 4 && recent.every(a => a >= 8)) due.push('streak');
  return due;
}
const CELEB_MILESTONES = [10, 25, 50, 100];
async function remindersScreen() {
  const sub = view.remindersSub || 'reminders';
  let cards = [];
  if (sub === 'reminders') {
    const { data: clientsData } = await supabase_client.rpc('coach_portal_reminder_data', { p_token: token });
    const { data: recentSent } = await supabase_client.rpc('coach_portal_recent_reminders', { p_token: token });
    const sentSet = new Set((recentSent || []).map(r => r.client_id + ':' + r.rule_key));
    (clientsData || []).forEach(c => {
      dueRulesFor(c).forEach(ruleKey => {
        if (sentSet.has(c.client_id + ':' + ruleKey)) return;
        const rule = REMINDER_RULES[ruleKey];
        const msg = rule.msg(c.client_name.split(' ')[0], (c.recent_adherence || []).length);
        cards.push({ label: rule.label, trigger: rule.trigger, name: c.client_name, msg, clientId: c.client_id, ruleKey, kind: 'reminder' });
      });
    });
  } else {
    const { data: celebData } = await supabase_client.rpc('coach_portal_celebration_data', { p_token: token });
    const { data: recentCeleb } = await supabase_client.rpc('coach_portal_recent_celebrations', { p_token: token });
    const sentSet = new Set((recentCeleb || []).map(r => r.client_id + ':' + r.celeb_key));
    (celebData || []).forEach(c => {
      const first = c.client_name.split(' ')[0];
      (c.recent_prs || []).forEach(pr => {
        const key = 'pr-' + pr.exercise.toLowerCase().replace(/\s+/g,'-');
        if (sentSet.has(c.client_id + ':' + key)) return;
        cards.push({ label: 'New PR', trigger: pr.exercise + ' — ' + pr.weight + ' lb', name: c.client_name,
          msg: `Hey ${first}, huge news — new PR on ${pr.exercise} at ${pr.weight} lb! All that work is paying off. Keep it up!`,
          clientId: c.client_id, ruleKey: key, kind: 'celeb' });
      });
      const milestone = CELEB_MILESTONES.filter(m => c.checkin_count >= m).pop();
      if (milestone) {
        const key = 'milestone-' + milestone;
        if (!sentSet.has(c.client_id + ':' + key)) {
          cards.push({ label: 'Check-In Milestone', trigger: milestone + ' total check-ins', name: c.client_name,
            msg: `Hey ${first}, you just hit ${milestone} check-ins with me — that kind of consistency is exactly what gets results. Really proud of you!`,
            clientId: c.client_id, ruleKey: key, kind: 'celeb' });
        }
      }
      if (c.weight_change_30d !== null && c.weight_change_30d <= -5) {
        const key = 'weightloss-30d';
        if (!sentSet.has(c.client_id + ':' + key)) {
          cards.push({ label: 'Progress Milestone', trigger: Math.abs(c.weight_change_30d).toFixed(1) + ' lb down in 30 days', name: c.client_name,
            msg: `Hey ${first}, you're down ${Math.abs(c.weight_change_30d).toFixed(1)} lb over the last 30 days — that's real progress. Awesome work!`,
            clientId: c.client_id, ruleKey: key, kind: 'celeb' });
        }
      }
    });
  }
  const cardsHtml = cards.map(c => `
    <div class="reminder-card">
      <div style="flex:1;">
        <div class="reminder-rule ${c.kind==='celeb'?'celeb':''}">${esc(c.label)}</div>
        <div class="name">${esc(c.name)}</div>
        <div class="meta">${esc(c.trigger)}</div>
        <div class="reminder-msg">${esc(c.msg)}</div>
      </div>
      <button class="btn btn-sm" data-send="${c.kind}" data-client="${c.clientId}" data-rule="${c.ruleKey}" data-msg="${escAttr(c.msg)}">Send</button>
    </div>
  `).join('');
  return `
    ${tabBar()}
    <h1>Reminders</h1>
    <div class="segrow" style="max-width:360px;">
      <button class="${sub==='reminders'?'sel':''}" data-sub="reminders">Reminders</button>
      <button class="${sub==='celebrations'?'sel':''}" data-sub="celebrations">Celebrations</button>
    </div>
    <div class="sub">${cards.length ? cards.length + ' item' + (cards.length===1?'':'s') + (sub==='reminders' ? ' due for a nudge' : ' worth celebrating') : (sub==='reminders' ? 'Everyone is on track — nothing due right now.' : 'Nothing to celebrate yet — check back after more check-ins and logged workouts.')}</div>
    <div class="card" style="padding:6px 20px;">

    </div>
  `;
}
function wireReminders() {
  wireTabBar();
  document.querySelectorAll('[data-sub]').forEach(btn => {
    btn.addEventListener('click', () => { view.remindersSub = btn.getAttribute('data-sub'); render(); });
  });
  document.querySelectorAll('[data-send]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const kind = btn.getAttribute('data-send');
      const clientId = btn.getAttribute('data-client');
      const ruleKey = btn.getAttribute('data-rule');
      const msg = btn.getAttribute('data-msg');
      const rpc = kind === 'celeb' ? 'coach_portal_send_celebration' : 'coach_portal_send_reminder';
      const params = kind === 'celeb'
        ? { p_token: token, p_client_id: clientId, p_celeb_key: ruleKey, p_message: msg }
        : { p_token: token, p_client_id: clientId, p_rule_key: ruleKey, p_message: msg };
      const { error } = await supabase_client.rpc(rpc, params);
      if (error) { toast('Error: ' + error.message); return; }
      await render();
      toast('Sent');
    });
  });
}

  document.querySelectorAll('[data-ex-name]').forEach(el => {
    const [di, ei] = el.getAttribute('data-ex-name').split(':').map(Number);
    workoutDraft.days[di].exercises[ei].name = el.value;
  });
  document.querySelectorAll('[data-ex-sets]').forEach(el => {
    const [di, ei] = el.getAttribute('data-ex-sets').split(':').map(Number);
    workoutDraft.days[di].exercises[ei].sets_reps = el.value;
  });
  const wn = document.getElementById('wName'), wt = document.getElementById('wTag'), ws = document.getElementById('wSummary');
  if (wn) workoutDraft.name = wn.value; if (wt) workoutDraft.tag = wt.value; if (ws) workoutDraft.summary = ws.value;
}
function syncMealDraftFromDom() {
  document.querySelectorAll('[data-meal-name]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-name')].name = el.value; });
  document.querySelectorAll('[data-meal-cal]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-cal')].calories = el.value; });
  document.querySelectorAll('[data-meal-protein]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-protein')].protein = el.value; });
  document.querySelectorAll('[data-meal-carbs]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-carbs')].carbs = el.value; });
  document.querySelectorAll('[data-meal-items]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-items')].items_text = el.value; });
  const mn = document.getElementById('mName'), mt = document.getElementById('mTag'), mc = document.getElementById('mCal'),
        mp = document.getElementById('mProtein'), mf = document.getElementById('mFat'), mcb = document.getElementById('mCarbs');

  if (mp) mealDraft.protein = mp.value; if (mf) mealDraft.fat = mf.value; if (mcb) mealDraft.carbs = mcb.value;
  if (!Array.isArray(mealDraft.swaps)) mealDraft.swaps = [];

  document.querySelectorAll('[data-swap-note]').forEach(el => { const gi = +el.getAttribute('data-swap-note'); if (mealDraft.swaps[gi]) mealDraft.swaps[gi].note = el.value; });
  document.querySelectorAll('[data-swap-item-name]').forEach(el => { const [gi, ii] = el.getAttribute('data-swap-item-name').split(':').map(Number); if (mealDraft.swaps[gi] && mealDraft.swaps[gi].items[ii]) mealDraft.swaps[gi].items[ii].name = el.value; });
  document.querySelectorAll('[data-swap-item-amt]').forEach(el => { const [gi, ii] = el.getAttribute('data-swap-item-amt').split(':').map(Number); if (mealDraft.swaps[gi] && mealDraft.swaps[gi].items[ii]) mealDraft.swaps[gi].items[ii].amount = el.value; });
}
async function rerenderPrograms() {
  app.innerHTML = topBar() + `<div class="container">${await programsScreen()}</div>`;

}
function wirePrograms() {
  wireTabBar();

  const aimb = document.getElementById('aiMealBtn'); if (aimb) aimb.addEventListener('click', () => openAiModal('meal'));
  document.getElementById('addDayBtn').addEventListener('click', () => {

  });
  document.querySelectorAll('[data-rm-day]').forEach(btn => btn.addEventListener('click', () => {
    syncWorkoutDraftFromDom();
    workoutDraft.days.splice(+btn.getAttribute('data-rm-day'), 1);
    rerenderPrograms();
  }));
  document.querySelectorAll('[data-add-ex]').forEach(btn => btn.addEventListener('click', () => {
    syncWorkoutDraftFromDom();
    workoutDraft.days[+btn.getAttribute('data-add-ex')].exercises.push({ name: '', sets_reps: '' });
    rerenderPrograms();
  }));

    syncWorkoutDraftFromDom();

    workoutDraft.days[di].exercises.splice(ei, 1);
    rerenderPrograms();
  }));
  document.getElementById('addWorkoutBtn').addEventListener('click', async () => {
    syncWorkoutDraftFromDom();

    const { error } = await supabase_client.rpc('coach_portal_add_workout', { p_token: token, p_name: workoutDraft.name.trim(), p_tag: workoutDraft.tag.trim(), p_summary: workoutDraft.summary.trim(), p_days: days });
    if (error) { toast('Error: ' + error.message); return; }
    workoutDraft = blankWorkoutDraft();
    await rerenderPrograms();
    toast('Workout split saved');
  });

  document.getElementById('addMealLineBtn').addEventListener('click', () => {
    syncMealDraftFromDom();
    mealDraft.meals.push({ name: '', calories: '', protein: '', fat: '', carbs: '', items_text: '' });

  });
  document.querySelectorAll('[data-rm-meal]').forEach(btn => btn.addEventListener('click', () => {
    syncMealDraftFromDom();
    mealDraft.meals.splice(+btn.getAttribute('data-rm-meal'), 1);
    rerenderPrograms();
  }));
  document.getElementById('autoGenBtn').addEventListener('click', () => {
    syncMealDraftFromDom();
    const cal = Number(mealDraft.calories) || 2000, pro = Number(mealDraft.protein) || 150, fat = Number(mealDraft.fat) || 60, carb = Number(mealDraft.carbs) || 200;
    const names = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
    const splits = [0.25, 0.35, 0.3, 0.1];
    mealDraft.meals = names.map((n, i) => ({
      name: n, calories: Math.round(cal * splits[i]), protein: Math.round(pro * splits[i]),
      fat: Math.round(fat * splits[i]), carbs: Math.round(carb * splits[i]), items_text: ''
    }));
    rerenderPrograms();
    toast('Auto-generated 4 meals from your macro targets');
  });
  document.getElementById('addSwapGroupBtn').addEventListener('click', () => {
    syncMealDraftFromDom();
    if (!Array.isArray(mealDraft.swaps)) mealDraft.swaps = [];
    const title = mealDraft.swaps.length === 0 ? 'Protein swaps' : (mealDraft.swaps.length === 1 ? 'Carb swaps' : '');
    mealDraft.swaps.push({ title, note: '', items: [{ name: '', amount: '' }] });
    rerenderPrograms();
  });
  document.querySelectorAll('[data-rm-swap]').forEach(btn => btn.addEventListener('click', () => {
    syncMealDraftFromDom();
    mealDraft.swaps.splice(+btn.getAttribute('data-rm-swap'), 1);
    rerenderPrograms();
  }));
  document.querySelectorAll('[data-add-swap-item]').forEach(btn => btn.addEventListener('click', () => {
    syncMealDraftFromDom();
    mealDraft.swaps[+btn.getAttribute('data-add-swap-item')].items.push({ name: '', amount: '' });
    rerenderPrograms();
  }));
  document.querySelectorAll('[data-rm-swap-item]').forEach(btn => btn.addEventListener('click', () => {
    syncMealDraftFromDom();
    const [gi, ii] = btn.getAttribute('data-rm-swap-item').split(':').map(Number);
    mealDraft.swaps[gi].items.splice(ii, 1);
    rerenderPrograms();
  }));
  document.getElementById('addMealBtn').addEventListener('click', async () => {
    syncMealDraftFromDom();
    if (!mealDraft.name.trim()) { toast('Meal plan name is required'); return; }
    const cleanSwaps = (Array.isArray(mealDraft.swaps) ? mealDraft.swaps : [])
      .map(g => ({ title: (g.title||'').trim(), note: (g.note||'').trim(), items: (g.items||[]).filter(it => (it.name||'').trim()).map(it => ({ name: it.name.trim(), amount: (it.amount||'').trim() })) }))
      .filter(g => g.title && g.items.length);
    const { error } = await supabase_client.rpc('coach_portal_add_meal_plan', {
      p_token: token, p_name: mealDraft.name.trim(), p_tag: mealDraft.tag.trim(),
      p_calories: mealDraft.calories ? Number(mealDraft.calories) : null, p_protein: mealDraft.protein ? Number(mealDraft.protein) : null,
      p_fat: mealDraft.fat ? Number(mealDraft.fat) : null, p_carbs: mealDraft.carbs ? Number(mealDraft.carbs) : null,
      p_meals: mealDraft.meals.filter(m => m.name.trim()), p_swaps: cleanSwaps
    });
    if (error) { toast('Error: ' + error.message); return; }
    mealDraft = blankMealDraft();
    await rerenderPrograms();
    toast('Meal plan saved');
  });
}

/* ================= AI PLAN GENERATOR ================= */
function openAiModal(kind) {
  const isMeal = kind === 'meal';
  modalHost.innerHTML = `
    <div class="modal-overlay" data-close-modal>
      <div class="modal">
        <div class="modal-head"><h2>✦ Generate ${isMeal ? 'Meal Plan' : 'Workout Split'}</h2><button class="modal-x" data-close-modal>×</button></div>
        <div class="field"><label>Client goal</label><input type="text" id="aiGoal" placeholder="e.g. lose fat, keep strength" autocomplete="off"></div>
        ${isMeal ? `
        <div class="row2">
          <div class="field"><label>Calories</label><input type="number" id="aiCal" placeholder="2200"></div>
          <div class="field"><label>Protein (g)</label><input type="number" id="aiPro" placeholder="170"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Fat (g)</label><input type="number" id="aiFat" placeholder="70"></div>
          <div class="field"><label>Carbs (g)</label><input type="number" id="aiCarb" placeholder="223"></div>
        </div>` : `
        <div class="field"><label>Training days / week</label><input type="number" id="aiDays" placeholder="5"></div>`}
        <div class="field" style="margin-bottom:6px;"><label>Notes / preferences (optional)</label><textarea id="aiNotes" placeholder="e.g. no dairy, trains at a commercial gym, sensitive knees"></textarea></div>
        <button class="btn btn-primary btn-block" id="aiGenBtn">✦ Generate Draft</button>
        <div class="status-line" id="aiStatus" style="margin-top:10px; text-align:center;"></div>
        <div class="status-line" style="margin-top:2px; text-align:center;">The draft loads into your builder below — review, edit, then Save.</div>
      </div>
    </div>`;
  document.getElementById('aiGoal').focus();
  wireModalClose();
  document.getElementById('aiGenBtn').addEventListener('click', () => runAiGenerate(kind));
}
async function runAiGenerate(kind) {
  const goal = document.getElementById('aiGoal').value.trim();
  const notes = document.getElementById('aiNotes').value.trim();
  const status = document.getElementById('aiStatus');
  const btn = document.getElementById('aiGenBtn');
  const reqBody = { token, kind, goal, notes };
  if (kind === 'meal') {
    reqBody.macros = {
      calories: Number(document.getElementById('aiCal').value) || null,
      protein: Number(document.getElementById('aiPro').value) || null,
      fat: Number(document.getElementById('aiFat').value) || null,
      carbs: Number(document.getElementById('aiCarb').value) || null,
    };
  } else {
    reqBody.days = Number(document.getElementById('aiDays').value) || null;
  }
  btn.disabled = true; status.textContent = 'Generating… this takes a few seconds.';
  try {
    const { data, error } = await supabase_client.functions.invoke('ai-generate-plan', { body: reqBody });
    if (error) { status.textContent = 'Error: ' + error.message; btn.disabled = false; return; }
    if (data && data.error) { status.textContent = data.error; btn.disabled = false; return; }
    const plan = data && data.plan;
    if (!plan) { status.textContent = 'No plan came back — try again.'; btn.disabled = false; return; }
    if (kind === 'meal') {
      mealDraft = {
        name: plan.name || '', tag: plan.tag || '',
        calories: plan.calories || '', protein: plan.protein || '', fat: plan.fat || '', carbs: plan.carbs || '',
        meals: (Array.isArray(plan.meals) ? plan.meals : []).map(m => ({ name: m.name||'', calories: m.calories||'', protein: m.protein||'', fat: m.fat||'', carbs: m.carbs||'', items_text: m.items_text||'' })),
        swaps: (Array.isArray(plan.swaps) ? plan.swaps : []).map(g => ({ title: g.title||'', note: g.note||'', items: (Array.isArray(g.items) ? g.items : []).map(it => ({ name: it.name||'', amount: it.amount||'' })) }))
      };
    } else {
      const days = (Array.isArray(plan.days) && plan.days.length) ? plan.days : [{ name: 'Day 1', cardio: '', exercises: [{ name: '', sets_reps: '' }] }];
      workoutDraft = {
        name: plan.name || '', tag: plan.tag || '', summary: plan.summary || '',
        days: days.map(d => ({
          name: d.name || '', cardio: d.cardio || '',
          exercises: (Array.isArray(d.exercises) && d.exercises.length ? d.exercises : [{ name: '', sets_reps: '' }]).map(e => ({ name: e.name || '', sets_reps: e.sets_reps || '' }))
        }))
      };
    }
    closeModal();
    await rerenderPrograms();
    toast('AI draft ready — review and edit, then Save.');
  } catch (e) {
    status.textContent = 'Error: ' + (e && e.message ? e.message : String(e)); btn.disabled = false;
  }
}

function statusFor(c) {
  if (c.checkin_count === 0) {
    return c.account_status === 'active' ? { label:'Awaiting check-in', cls:'muted' } : { label:'Invited', cls:'warn' };
  }
  const age = daysAgo(c.last_checkin_date);
  if (age === null) return { label:'Awaiting check-in', cls:'muted' };
  if (age >= 14) return { label:'Overdue', cls:'critical' };
  if (age >= 9) return { label:'Slipping', cls:'warn' };
  return { label:'On track', cls:'good' };
}
function miniSpark(points) {
  const pts = (points || []).map(p => Number(p.weight)).filter(v => !isNaN(v));
  const w = 74, h = 30;
  if (pts.length < 2) return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="2" y1="${h/2}" x2="${w-2}" y2="${h/2}" stroke="var(--border)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4"/></svg>`;
  const min = Math.min(...pts), max = Math.max(...pts), range = (max - min) || 1;
  const stepX = (w - 4) / (pts.length - 1);
  const down = pts[pts.length-1] <= pts[0];
  const color = down ? 'var(--good)' : 'var(--critical)';
  const coords = pts.map((v, i) => [2 + i * stepX, h - 5 - ((v - min) / range) * (h - 10)]);
  const path = coords.map((c, i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function trendCell(c) {
  const pts = (c.weight_points || []).map(p => Number(p.weight)).filter(v => !isNaN(v));
  let delta = '';
  if (pts.length >= 2) {
    const d = pts[pts.length-1] - pts[0];
    const cls = d < 0 ? 'good' : (d > 0 ? 'bad' : 'flat');
    delta = `<span class="delta ${cls}">${d>0?'+':''}${d.toFixed(1)} lb</span>`;
  } else {
    delta = `<span class="delta flat">—</span>`;
  }
  return `<div class="trend">${miniSpark(c.weight_points)}${delta}</div>`;
}
function computeStats(list) {
  const total = list.length;
  const active = list.filter(c => c.account_status === 'active');
  const brandNew = list.filter(c => (c.checkin_count || 0) === 0).length;
  const pending = list.filter(c => c.account_status !== 'active').length;
  const checkedIn8 = active.filter(c => { const d = daysAgo(c.last_checkin_date); return d !== null && d <= 8; }).length;
  const checkedInWeek = list.filter(c => { const d = daysAgo(c.last_checkin_date); return d !== null && d <= 7; }).length;
  const needsAttention = active.filter(c => { const d = daysAgo(c.last_checkin_date); return d === null || d >= 9; }).length;
  const adh = list.map(c => c.last_adherence).filter(a => a !== null && a !== undefined);
  const avgAdh = adh.length ? (adh.reduce((s,a)=>s+a,0)/adh.length) : null;
  return { total, activeCount: active.length, brandNew, pending, checkedIn8, checkedInWeek, needsAttention, avgAdh };
}

      <div class="cell-client">

function sparklineSvg(points, w, h) {
  if (points.length < 2) return '<div class="empty" style="padding:10px;">Not enough data for a chart yet.</div>';
  const vals = points.map(p => p.weight);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = w / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = i * stepX;
    const y = h - ((p.weight - min) / range) * (h - 16) - 8;
    return [x, y];
  });
  const path = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--accent-strong)" />`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="none" style="overflow:visible;">
    <path d="${path}" fill="none" stroke="var(--accent-strong)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
    ${dots}
  </svg>`;
}

/* ================= PROGRESS PHOTO VIEWER (full screen + compare) ================= */
function fmtPhotoDate(d) {
  try { return new Date(d + 'T00:00:00').toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch (e) { return d; }
}
function daysBetween(a, b) {
  try {
    const ms = Math.abs(new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00'));
    return Math.round(ms / 86400000);
  } catch (e) { return null; }
}
function closePhotoViewer() {
  photoViewerHost.innerHTML = '';
  document.removeEventListener('keydown', photoViewerKey);
}
function photoViewerKey(e) {
  const host = photoViewerHost.firstElementChild;
  if (!host) return;
  if (e.key === 'Escape') { closePhotoViewer(); return; }
  const cur = host.getAttribute('data-single-idx');
  if (cur === null || cur === undefined) return;
  const i = Number(cur);
  if (e.key === 'ArrowLeft' && i > 0) renderPhotoSingle(i - 1);
  if (e.key === 'ArrowRight' && i < progressPhotos.length - 1) renderPhotoSingle(i + 1);
}
function openPhotoViewer(idx) {
  document.addEventListener('keydown', photoViewerKey);
  renderPhotoSingle(idx);
}
function renderPhotoSingle(idx) {
  const p = progressPhotos[idx];
  if (!p) return;
  const total = progressPhotos.length;
  photoViewerHost.innerHTML = `
    <div class="pv-overlay" data-single-idx="${idx}">
      <div class="pv-top">
        <div class="pv-title">Progress Photo · ${idx + 1} of ${total}</div>
        <div class="pv-actions">
          ${total >= 2 ? `<button class="pv-btn" id="pvCompareFromSingle">Compare</button>` : ''}
          <button class="pv-x" data-pv-close aria-label="Close">×</button>
        </div>
      </div>
      <div class="pv-stage" data-pv-close-bg>
        ${idx > 0 ? `<button class="pv-nav prev" id="pvPrev" aria-label="Previous">‹</button>` : ''}
        <img src="${p.storage_path}" alt="progress photo ${p.date}">
        ${idx < total - 1 ? `<button class="pv-nav next" id="pvNext" aria-label="Next">›</button>` : ''}
      </div>
      <div class="pv-caption"><b>${fmtPhotoDate(p.date)}</b>${p.note ? ' · ' + esc(p.note) : ''}</div>
    </div>`;
  photoViewerHost.querySelectorAll('[data-pv-close]').forEach(el => el.addEventListener('click', closePhotoViewer));
  const bg = photoViewerHost.querySelector('[data-pv-close-bg]');
  if (bg) bg.addEventListener('click', e => { if (e.target === bg) closePhotoViewer(); });
  const prev = document.getElementById('pvPrev');
  if (prev) prev.addEventListener('click', () => renderPhotoSingle(idx - 1));
  const next = document.getElementById('pvNext');
  if (next) next.addEventListener('click', () => renderPhotoSingle(idx + 1));
  const cmp = document.getElementById('pvCompareFromSingle');
  if (cmp) cmp.addEventListener('click', () => {
    // compare this photo against the next-oldest one by default (or the previous if it's the oldest)
    const other = idx < total - 1 ? idx + 1 : idx - 1;
    openCompare(idx, other);
  });
}
function openCompare(a, b) {
  const pa = progressPhotos[a], pb = progressPhotos[b];
  if (!pa || !pb) return;
  // show older on the left, newer on the right
  let left = pa, right = pb;
  if (new Date(pa.date) > new Date(pb.date)) { left = pb; right = pa; }
  const gap = daysBetween(left.date, right.date);
  const gapTxt = gap != null && gap > 0 ? `<span class="delta">+${gap} day${gap === 1 ? '' : 's'} apart</span>` : '';
  document.addEventListener('keydown', photoViewerKey);
  photoViewerHost.innerHTML = `
    <div class="pv-overlay">
      <div class="pv-top">
        <div class="pv-title">Compare</div>
        <div class="pv-actions">
          <button class="pv-x" data-pv-close aria-label="Close">×</button>
        </div>
      </div>
      <div class="pv-compare">
        <div class="pv-pane">
          <div class="pv-img-wrap"><img src="${left.storage_path}" alt="progress photo ${left.date}"></div>
          <div class="pv-pane-cap"><b>${fmtPhotoDate(left.date)}</b><br>Earlier</div>
        </div>
        <div class="pv-pane">
          <div class="pv-img-wrap"><img src="${right.storage_path}" alt="progress photo ${right.date}"></div>
          <div class="pv-pane-cap"><b>${fmtPhotoDate(right.date)}</b><br>Later ${gapTxt}</div>
        </div>
      </div>
      <div class="pv-caption">Tap the ✕ to close · pick two dates from the strip to compare others.</div>
    </div>`;
  photoViewerHost.querySelectorAll('[data-pv-close]').forEach(el => el.addEventListener('click', closePhotoViewer));
}
function resetCompareMode() {
  compareSelect = null;
  const btn = document.getElementById('comparePhotosBtn');
  if (btn) btn.textContent = 'Compare';
  const hint = document.getElementById('photoHint');
  if (hint) hint.textContent = 'Tap a photo to view it full screen.';
  document.querySelectorAll('[data-photo-idx]').forEach(el => el.classList.remove('cmp-pick', 'cmp-chosen'));
}
function wirePhotos() {
  const imgs = document.querySelectorAll('[data-photo-idx]');
  if (!imgs.length) return;
  const cmpBtn = document.getElementById('comparePhotosBtn');
  const hint = document.getElementById('photoHint');
  if (cmpBtn) cmpBtn.addEventListener('click', () => {
    if (compareSelect === null) {
      compareSelect = [];
      cmpBtn.textContent = 'Cancel';
      if (hint) hint.textContent = 'Select two photos to compare.';
      document.querySelectorAll('[data-photo-idx]').forEach(el => el.classList.add('cmp-pick'));
    } else {
      resetCompareMode();
    }
  });
  imgs.forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.getAttribute('data-photo-idx'));
      if (compareSelect === null) { openPhotoViewer(idx); return; }
      const pos = compareSelect.indexOf(idx);
      if (pos >= 0) { compareSelect.splice(pos, 1); el.classList.remove('cmp-chosen'); if (hint) hint.textContent = 'Select two photos to compare.'; return; }
      if (compareSelect.length >= 2) return;
      compareSelect.push(idx);
      el.classList.add('cmp-chosen');
      if (compareSelect.length === 1 && hint) hint.textContent = '1 selected · pick one more.';
      if (compareSelect.length === 2) {
        const pair = compareSelect.slice();
        resetCompareMode();
        openCompare(pair[0], pair[1]);
      }
    });
  });
}

function wireDetail() {
  document.getElementById('backBtn').addEventListener('click', () => { view.screen = 'roster'; view.clientId = null; render(); });
  wirePhotos();
  document.querySelectorAll('[data-dtab]').forEach(btn => {
    btn.addEventListener('click', () => { view.detailTab = btn.getAttribute('data-dtab'); msgDraft = ''; render(); });
  });
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) copyBtn.addEventListener('click', () => {
    const el = document.getElementById('inviteInput');
    el.select();
    navigator.clipboard?.writeText(el.value).catch(() => document.execCommand('copy'));
    toast('Invite link copied');
  });
  const textInviteBtn = document.getElementById('textInviteBtn');
  if (textInviteBtn) textInviteBtn.addEventListener('click', () => {
    const client = clients.find(c => c.id === view.clientId);
    const link = document.getElementById('inviteInput').value;
    const msg = `Hey ${client.name.split(' ')[0]}! Here's your check-in link: ${link}`;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const sep = isIOS ? '&' : '?';
    window.location.href = `sms:${client.phone}${sep}body=${encodeURIComponent(msg)}`;
  });
  const saveAssignBtn = document.getElementById('saveAssignBtn');
  if (saveAssignBtn) saveAssignBtn.addEventListener('click', async () => {
    const workoutId = document.getElementById('assignWorkout').value || null;
    const mealId = document.getElementById('assignMeal').value || null;
    const { error } = await supabase_client.rpc('coach_portal_assign_programs', { p_token: token, p_client_id: view.clientId, p_workout_id: workoutId, p_meal_plan_id: mealId });
    if (error) { toast('Error: ' + error.message); return; }
    await render();
    toast('Programs assigned');
  });
  const saveBillBtn = document.getElementById('saveBillBtn');
  if (saveBillBtn) saveBillBtn.addEventListener('click', async () => {
    const amount = document.getElementById('bAmount').value;
    const term = document.getElementById('bTerm').value;
    const start = document.getElementById('bStart').value;
    const end = document.getElementById('bEnd').value;
    if (!amount || !start || !end) { toast('Fill in amount, start, and end date'); return; }
    const { error } = await supabase_client.rpc('coach_portal_set_billing', { p_token: token, p_client_id: view.clientId, p_term: term, p_amount: Number(amount), p_start: start, p_end: end });
    if (error) { toast('Error: ' + error.message); return; }
    await render();
    toast('Billing saved');
  });
  const pdfInput = document.getElementById('pdfInput');
  const pdfUploadBtn = document.getElementById('pdfUploadBtn');
  const pdfDrop = document.getElementById('pdfDrop');
  async function uploadPdfFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) { toast('Please choose a PDF file'); return; }
    const st = document.getElementById('pdfStatus'); if (st) st.textContent = 'Uploading…';
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(file); });
      const { data, error } = await supabase_client.functions.invoke('set-meal-pdf', { body: { token, client_id: view.clientId, file_base64: b64, file_name: file.name } });
      if (error || (data && data.error)) { if (st) st.textContent = 'Error: ' + (error ? error.message : data.error); return; }
      await render();
      toast('Meal plan PDF uploaded');
    } catch (e) { if (st) st.textContent = 'Error: ' + (e && e.message ? e.message : String(e)); }
  }
  if (pdfUploadBtn) pdfUploadBtn.addEventListener('click', () => pdfInput.click());
  if (pdfDrop) pdfDrop.addEventListener('click', () => pdfInput.click());
  if (pdfInput) pdfInput.addEventListener('change', () => uploadPdfFile(pdfInput.files[0]));
  if (pdfDrop) {
    ['dragover','dragenter'].forEach(ev => pdfDrop.addEventListener(ev, e => { e.preventDefault(); pdfDrop.style.borderColor = 'var(--accent)'; }));
    ['dragleave','dragend'].forEach(ev => pdfDrop.addEventListener(ev, e => { e.preventDefault(); pdfDrop.style.borderColor = 'var(--border)'; }));
    pdfDrop.addEventListener('drop', e => { e.preventDefault(); pdfDrop.style.borderColor = 'var(--border)'; if (e.dataTransfer && e.dataTransfer.files[0]) uploadPdfFile(e.dataTransfer.files[0]); });
  }
  const pdfRemoveBtn = document.getElementById('pdfRemoveBtn');
  if (pdfRemoveBtn) pdfRemoveBtn.addEventListener('click', async () => {
    if (!confirm('Remove this meal plan PDF?')) return;
    const { data, error } = await supabase_client.functions.invoke('set-meal-pdf', { body: { token, client_id: view.clientId, remove: true } });
    if (error || (data && data.error)) { toast('Error removing PDF'); return; }
    await render();
    toast('Meal plan PDF removed');
  });
  const pdfInputW = document.getElementById('pdfInputW');
  const pdfUploadBtnW = document.getElementById('pdfUploadBtnW');
  const pdfDropW = document.getElementById('pdfDropW');
  async function uploadWorkoutPdfFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) { toast('Please choose a PDF file'); return; }
    const st = document.getElementById('pdfStatusW'); if (st) st.textContent = 'Uploading…';
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(file); });
      const { data, error } = await supabase_client.functions.invoke('set-workout-pdf', { body: { token, client_id: view.clientId, file_base64: b64, file_name: file.name } });
      if (error || (data && data.error)) { if (st) st.textContent = 'Error: ' + (error ? error.message : data.error); return; }
      await render();
      toast('Workout plan PDF uploaded');
    } catch (e) { if (st) st.textContent = 'Error: ' + (e && e.message ? e.message : String(e)); }
  }
  if (pdfUploadBtnW) pdfUploadBtnW.addEventListener('click', () => pdfInputW.click());
  if (pdfDropW) pdfDropW.addEventListener('click', () => pdfInputW.click());
  if (pdfInputW) pdfInputW.addEventListener('change', () => uploadWorkoutPdfFile(pdfInputW.files[0]));
  if (pdfDropW) {
    ['dragover','dragenter'].forEach(ev => pdfDropW.addEventListener(ev, e => { e.preventDefault(); pdfDropW.style.borderColor = 'var(--accent)'; }));
    ['dragleave','dragend'].forEach(ev => pdfDropW.addEventListener(ev, e => { e.preventDefault(); pdfDropW.style.borderColor = 'var(--border)'; }));
    pdfDropW.addEventListener('drop', e => { e.preventDefault(); pdfDropW.style.borderColor = 'var(--border)'; if (e.dataTransfer && e.dataTransfer.files[0]) uploadWorkoutPdfFile(e.dataTransfer.files[0]); });
  }
  const pdfRemoveBtnW = document.getElementById('pdfRemoveBtnW');
  if (pdfRemoveBtnW) pdfRemoveBtnW.addEventListener('click', async () => {
    if (!confirm('Remove this workout plan PDF?')) return;
    const { data, error } = await supabase_client.functions.invoke('set-workout-pdf', { body: { token, client_id: view.clientId, remove: true } });
    if (error || (data && data.error)) { toast('Error removing PDF'); return; }
    await render();
    toast('Workout plan PDF removed');
  });
  const msgInput = document.getElementById('msgInput');
  if (msgInput) msgInput.addEventListener('input', e => { msgDraft = e.target.value; });
  const sendMsgBtn = document.getElementById('sendMsgBtn');
  if (sendMsgBtn) sendMsgBtn.addEventListener('click', async () => {
    if (!msgDraft.trim()) return;
    const { error } = await supabase_client.rpc('coach_portal_send_message', { p_token: token, p_client_id: view.clientId, p_text: msgDraft.trim() });
    if (error) { toast('Error: ' + error.message); return; }
    msgDraft = '';
    await render();
  });
}

boot();
</script>
