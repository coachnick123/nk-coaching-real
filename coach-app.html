<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NT Coaching</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NT Coaching">
<meta name="theme-color" content="#05070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0d13; --surface:#141a24; --surface-alt:#1b2230; --surface-sunken:#0b0f16; --border:rgba(255,255,255,0.08); --border-2:rgba(255,255,255,0.14);
    --ink:#f3f6fb; --ink-2:#c3cbd8; --muted:#848e9f;
    --accent:#e7b34a; --accent-strong:#f6cf73; --accent-2:#f6cf73; --on-accent:#241a00; --accent-soft:rgba(231,179,74,0.15); --accent-line:rgba(231,179,74,0.33);
    --good:#37d39a; --good-soft:rgba(55,211,154,0.15); --warn:#f5c04e; --warn-soft:rgba(245,192,78,0.15); --critical:#f2766a; --critical-soft:rgba(242,118,106,0.15);
    --info:#f6cf73; --info-soft:rgba(231,179,74,0.15);
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 14px 30px -18px rgba(0,0,0,0.9);
    --disp:"Hanken Grotesk",-apple-system,Segoe UI,Roboto,sans-serif;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:radial-gradient(1100px 520px at 50% -10%, #11161f 0%, transparent 60%), var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  h1 { font-family:"Hanken Grotesk",sans-serif; font-weight:800; font-size:30px; margin:0 0 6px; letter-spacing:-0.4px; }
  h2 { font-family:"Hanken Grotesk",sans-serif; font-weight:700; font-size:16px; margin:22px 0 10px; }
  a { color:var(--accent-strong); }
  .sub { color:var(--ink-2); font-size:14px; margin-bottom:20px; }
  .sub .hl { color:var(--accent-strong); font-weight:600; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:6px; }
  input, textarea, select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px; font-size:14px; background:var(--surface); color:var(--ink); font-family:inherit; }
  textarea { min-height:70px; resize:vertical; }
  .field { margin-bottom:14px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid transparent; border-radius:11px; padding:11px 16px; font-family:var(--disp); font-weight:700; font-size:13.5px; cursor:pointer; background:linear-gradient(145deg,var(--accent-2),var(--accent)); color:var(--on-accent); white-space:nowrap; box-shadow:0 10px 22px -14px var(--accent); }
  .btn:hover { filter:brightness(1.08); }
  .btn-ghost { background:transparent; border-color:var(--border); color:var(--ink); }
  .btn-primary { background:linear-gradient(145deg,var(--accent-2),var(--accent)); color:var(--on-accent); font-weight:800; }
  .brand-logo { height:40px; width:auto; display:block; max-width:180px; object-fit:contain; }
  .brand-mark-circle { height:40px; width:40px; border-radius:11px; background:linear-gradient(145deg,var(--accent-2),var(--accent)); color:var(--on-accent); font-weight:800; font-size:15px; letter-spacing:.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 6px 16px -6px var(--accent); }
  .logo-edit { display:flex; align-items:center; gap:12px; }
  .logo-edit img { height:44px; width:auto; max-width:180px; object-fit:contain; }
  .logo-edit-btns { display:flex; gap:8px; }
  .btn-sm { padding:8px 12px; font-size:12.5px; width:auto; }
  .btn-block { width:100%; }
  .btn-danger { background:var(--critical-soft); color:var(--critical); border-color:transparent; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--border); }
  .row:first-child { border-top:none; }
  .name { font-weight:600; }
  .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .chip.active, .chip.good { background:var(--good-soft); color:var(--good); }
  .chip.invited, .chip.warn { background:var(--warn-soft); color:var(--warn); }
  .chip.critical { background:var(--critical-soft); color:var(--critical); }
  .chip.muted { background:var(--surface-sunken); color:var(--ink-2); }
  .chip.head { background:var(--accent-soft); color:var(--accent-strong); }
  .chip.assistant { background:var(--surface-sunken); color:var(--ink-2); }
  .chip .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .back { background:none; border:none; color:var(--ink-2); font-size:13px; cursor:pointer; padding:0; margin-bottom:16px; }
  .invite-box { display:flex; gap:8px; margin-top:6px; }
  .invite-box input { flex:1; font-family:monospace; font-size:12.5px; background:var(--surface-alt); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a2333; border:1px solid var(--border); color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity 0.2s; z-index:60; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; }
  /* swipe-to-archive on roster rows */
  .swipe-wrap { position:relative; overflow:hidden; }
  .swipe-wrap .roster-row { position:relative; z-index:1; background:var(--surface); transition:transform .18s ease; }
  .swipe-wrap .roster-row:hover { background:var(--surface-alt); }
  .swipe-wrap.open .roster-row { transform:translateX(-104px); }
  .swipe-actions { position:absolute; top:0; right:0; bottom:0; width:104px; display:flex; }
  .swipe-archive { flex:1; border:none; background:var(--critical); color:#fff; font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .roster .swipe-wrap:first-of-type .roster-row { border-top:none; }
  @media (hover:hover) and (pointer:fine) { .swipe-wrap:hover .roster-row { transform:translateX(-104px); } }
  .archived-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 2px; border-top:1px solid var(--border); }
  .archived-row:first-of-type { border-top:none; }
  .archived-row .a-name { font-weight:600; font-size:14px; }
  .archived-row .a-meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .archived-actions { display:flex; gap:8px; flex-shrink:0; }
  /* workout split editor */
  .we-day { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--surface-alt); }
  .we-day-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .we-day-name { font-weight:700; font-size:14px; }
  .we-ex { display:grid; grid-template-columns:1fr 86px 24px; gap:8px; align-items:center; margin-bottom:6px; }
  .we-ex input { padding:8px 10px; }
  .we-cardio { font-size:12px; color:var(--muted); margin-top:6px; }
  .we-tappable { cursor:pointer; }
  .we-tappable:hover { background:var(--surface-alt); }
  .habit-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
  .habit-row:first-of-type { border-top:none; }
  .habit-name { font-weight:600; font-size:14px; }
  .habit-week { display:flex; gap:4px; margin-top:6px; }
  .hdot { width:12px; height:12px; border-radius:50%; background:var(--border); display:inline-block; }
  .hdot.on { background:var(--accent); }
  .habit-side { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .streak { font-size:13px; font-weight:700; color:var(--accent-strong); white-space:nowrap; }
  .status-line { font-size:12.5px; color:var(--muted); margin-bottom:14px; }
  .checkin-item { padding:10px 0; border-top:1px solid var(--border); font-size:13px; }
  .checkin-item:first-child { border-top:none; }
  .empty { color:var(--muted); font-size:13.5px; padding:26px 0; text-align:center; }

  /* ---- App shell ---- */
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:13px 24px; background:var(--surface); border-bottom:1px solid var(--border); }
  .topbar-brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .tb-name { font-family:"Hanken Grotesk",sans-serif; font-weight:800; font-size:16px; letter-spacing:-0.2px; line-height:1.15; }
  .tb-tag { font-size:10.5px; font-weight:700; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin-top:1px; }
  .privatepill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-2);
    background:var(--surface-alt); border:1px solid var(--border); padding:6px 12px; border-radius:999px; }
  .container { max-width:1180px; margin:0 auto; padding:24px 24px 72px; }
  .container-narrow { max-width:460px; padding-top:56px; }
  .brand-row { display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .brand-mark { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:radial-gradient(120% 120% at 30% 20%, #202228, #0a0b0d); border:1px solid #47401f; overflow:hidden; }
  .brand-mark svg { width:100%; height:100%; }

  /* ---- Tabs ---- */
  .tab-bar { display:inline-flex; gap:2px; background:var(--surface-alt); border-radius:12px; padding:4px; margin-bottom:24px; max-width:100%; overflow-x:auto; }
  .tab-btn { border:none; background:none; padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--ink-2); cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; }
  .tab-btn.sel { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.08); }
  .tab-badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--critical); color:#fff; font-size:10.5px; font-weight:700; margin-left:7px; }

  /* ---- Toolbar ---- */
  .toolbar { display:flex; gap:10px; align-items:center; margin:16px 0 20px; flex-wrap:wrap; }
  .search { position:relative; flex:1; min-width:180px; }
  .search input { padding-left:36px; }
  .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted); pointer-events:none; }
  .toolbar select { width:auto; min-width:150px; }

  /* ---- Stat cards ---- */
  .statgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .statcard { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
  .statcard .l { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:9px; }
  .statcard .big { font-family:"Hanken Grotesk",sans-serif; font-weight:800; font-size:34px; line-height:1; letter-spacing:-0.5px; }
  .statcard .big small { font-size:18px; color:var(--muted); font-weight:700; }
  .statcard .foot { font-size:12px; color:var(--ink-2); margin-top:8px; }
  .statcard.good .big { color:var(--good); }
  .statcard.warn .big { color:var(--warn); }
  .statcard.accent .big { color:var(--accent-strong); }

  /* ---- Roster table ---- */
  .roster { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .roster-head, .roster-row { display:grid; grid-template-columns:2.3fr 1fr 1.5fr 1.2fr 1.1fr 26px; align-items:center; gap:14px; padding:14px 20px; }
  .roster-head { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); border-bottom:1px solid var(--border); }
  .roster-row { border-top:1px solid var(--border); width:100%; text-align:left; background:none; color:inherit; font:inherit; cursor:pointer; }
  .roster-row:first-of-type { border-top:none; }
  .roster-row:hover { background:var(--surface-alt); }
  .cell-client { display:flex; align-items:center; gap:12px; min-width:0; }
  .avatar { width:34px; height:34px; border-radius:50%; background:var(--surface-sunken); color:var(--ink-2); display:flex; align-items:center; justify-content:center; font-family:"Hanken Grotesk",sans-serif; font-weight:700; font-size:13px; flex-shrink:0; }
  .cell-name { font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .newbadge { display:inline-block; background:var(--info-soft); color:var(--info); font-size:10px; font-weight:700; padding:1px 7px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .cell-weight { font-weight:700; font-size:15px; }
  .cell-weight span { color:var(--muted); font-weight:500; font-size:12px; }
  .trend { display:flex; align-items:center; gap:8px; }
  .trend svg { width:74px; height:30px; flex-shrink:0; }
  .trend .delta { font-size:12.5px; font-weight:700; }
  .delta.good { color:var(--good); } .delta.bad { color:var(--critical); } .delta.flat { color:var(--muted); }
  .cell-check { font-size:13.5px; color:var(--ink-2); }
  .chev { color:var(--muted); justify-self:end; }
  @media (max-width:780px) {
    .roster-head { display:none; }
    .roster-row { grid-template-columns:minmax(0,1fr) auto auto; grid-auto-rows:auto; gap:10px; padding:14px 16px; }
    .roster-row .cell-trend, .roster-row .cell-check, .roster-row .chev { display:none; }
  }

  /* ---- Modal ---- */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.66); display:flex; align-items:flex-start; justify-content:center; padding:56px 16px; z-index:50; overflow:auto; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px; max-width:440px; width:100%; box-shadow:0 24px 60px -20px rgba(0,0,0,0.7); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-head h2 { margin:0; font-size:18px; }
  .modal-x { background:none; border:none; font-size:22px; line-height:1; color:var(--muted); cursor:pointer; padding:0 2px; }
  .warn-banner { background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:12px 16px; font-size:13px; font-weight:600; margin-bottom:18px; }

  /* ---- misc shared (detail / programs / billing / reminders) ---- */
  .chat-thread { height:calc(100dvh - 310px); min-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:12px; padding:2px; }
  .bubble-wrap { display:flex; flex-direction:column; max-width:82%; }
  .bubble-wrap.me { align-self:flex-end; align-items:flex-end; }
  .bubble-wrap.them { align-self:flex-start; align-items:flex-start; }
  .bubble { max-width:100%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.4; }
  .bubble.coach { background:linear-gradient(145deg,var(--accent-2),var(--accent)); color:var(--on-accent); border-bottom-right-radius:4px; font-weight:500; }
  .bubble.client { background:var(--surface-alt); color:var(--ink); border-bottom-left-radius:4px; }
  .bubble-who { font-size:10px; font-weight:800; color:var(--ink-2); margin:0 0 3px 4px; letter-spacing:.3px; }
  .like-btn { display:inline-flex; align-items:center; gap:3px; margin:3px 4px 0; font-size:11px; font-weight:700; color:var(--muted); background:none; border:none; cursor:pointer; padding:1px 2px; line-height:1; }
  .like-btn .hrt { font-size:13px; line-height:1; transition:transform .12s; }
  .like-btn.liked { color:#ff4d6d; }
  .like-btn.liked .hrt { transform:scale(1.15); }
  .likecount { font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; padding:2px 4px; }
  .cav { width:30px; height:30px; border-radius:50%; object-fit:cover; flex:none; }
  .cav.cav-ini { display:grid; place-items:center; background:linear-gradient(145deg,var(--accent-2),var(--accent)); color:var(--on-accent); font-weight:800; font-size:12px; }
  .cav.big { width:92px; height:92px; font-size:34px; }
  .msgrow { display:flex; gap:8px; align-items:flex-end; }
  .msgrow.me { flex-direction:row-reverse; align-self:flex-end; }
  .msgrow .cav { margin-bottom:4px; }
  .lk-ov { position:fixed; inset:0; z-index:300; background:rgba(3,6,12,.72); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; }
  .lk-card { width:100%; max-width:320px; background:var(--bg,#0a0d13); border:1px solid var(--border,rgba(255,255,255,.1)); border-radius:18px; padding:20px; }
  .lk-h { font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--accent-strong,#5b9bff); margin-bottom:12px; }
  .lk-row { display:flex; align-items:center; gap:10px; padding:7px 0; font-size:15px; }
  .chat-input-row { display:flex; gap:8px; align-items:center; }
  .chat-input-row input { flex:1; }
  .goal-seg { display:flex; flex-wrap:wrap; gap:6px; }
  .goal-seg button { flex:1; min-width:46%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface-sunken); color:var(--ink-2); font-weight:600; font-size:13px; cursor:pointer; }
  .goal-seg button.sel { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--ink); }
  .goal-chip { display:inline-flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:.3px; padding:3px 10px; border-radius:999px; background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent-2); text-transform:uppercase; }
  .bill-summary { font-size:14px; }
  .bill-summary b { font-size:18px; }
  .stock-badge { display:inline-flex; align-items:center; font-size:10px; font-weight:700; letter-spacing:0.3px; padding:2px 8px; border-radius:999px; background:var(--surface-sunken); color:var(--ink-2); margin-left:6px; text-transform:uppercase; }
  .reminder-card { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:14px 0; border-top:1px solid var(--border); }
  .reminder-card:first-child { border-top:none; }
  .reminder-rule { font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:var(--warn); margin-bottom:3px; }
  .reminder-rule.celeb { color:var(--good); }
  .reminder-msg { font-size:12.5px; color:var(--ink-2); margin-top:4px; line-height:1.5; }
  .segrow { display:flex; gap:6px; margin-bottom:16px; }
  .segrow button { flex:1; padding:8px 0; border:1px solid var(--border); background:var(--surface); border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-2); }
  .segrow button.sel { background:linear-gradient(145deg,var(--accent-2),var(--accent)); color:var(--on-accent); border-color:transparent; }
  .accent-swatches { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .accent-swatch { width:32px; height:32px; border-radius:8px; cursor:pointer; border:2px solid transparent; }
  .accent-swatch.sel { border-color:var(--ink); }
  .day-card { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--surface-alt); }
  .day-card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .day-card-name-input { font-weight:700; }
  .ex-row { display:flex; gap:8px; margin-bottom:6px; align-items:center; }
  .ex-row input { flex:1; }
  .ex-row input.sets { flex:0 0 90px; }
  .rm-btn { background:none; border:none; color:var(--critical); cursor:pointer; font-size:16px; padding:0 4px; flex-shrink:0; }
  .add-line-btn { background:none; border:1px dashed var(--border); color:var(--ink-2); border-radius:7px; padding:7px 10px; font-size:12px; cursor:pointer; width:100%; margin-top:2px; }
  .macro-tile-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0; }
  .macro-tile { background:var(--surface-alt); border-radius:8px; padding:8px 4px; text-align:center; }
  .macro-tile .n { font-family:"Hanken Grotesk",sans-serif; font-weight:800; font-size:15px; }
  .macro-tile .l { font-size:9.5px; color:var(--muted); text-transform:uppercase; }

function fileToLogoDataUri(file, maxDim) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      let out = null;
      try { out = canvas.toDataURL('image/webp', 0.9); } catch (e) {}
      if (!out || out.indexOf('data:image/webp') !== 0) out = canvas.toDataURL('image/png');
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src = url;
  });
}

/* ================= REMINDERS + CELEBRATIONS ================= */
const REMINDER_RULES = {
  attention: { label: 'Needs Attention', trigger: '9–13 days since last check-in', msg: n => `Hey ${n}, just checking in — haven't seen your weekly check-in yet. No pressure, just want to make sure you're good!` },
  overdue: { label: 'Overdue Check-In', trigger: '14+ days since last check-in', msg: n => `Hey ${n}, it's been a couple weeks since your last check-in. Let's get you back on track — send over your numbers whenever you get a chance, even if it's not your best week.` },
  'low-adherence': { label: 'Low Adherence', trigger: 'adherence scored 4 or below', msg: n => `Hey ${n}, saw adherence was a bit lower this week — totally normal, everyone has those. What got in the way? Let's figure out a plan that fits your week better.` },
  streak: { label: 'Streak Shoutout', trigger: '4+ check-ins in a row with adherence 8+', msg: (n, s) => `Hey ${n}, you've been crushing it lately — ${s} strong check-ins in a row with great adherence. Proud of the consistency, keep it up!` },
};
function dueRulesFor(c) {
  const due = [];
  const age = daysAgo(c.last_checkin_date);
  if (age !== null) {
    if (age >= 9 && age <= 13) due.push('attention');
    if (age >= 14) due.push('overdue');
  }
  if (c.last_adherence !== null && c.last_adherence <= 4) due.push('low-adherence');
  const recent = c.recent_adherence || [];
  if (c.checkin_count >= 4 && recent.length >= 4 && recent.every(a => a >= 8)) due.push('streak');
  return due;
}
const CELEB_MILESTONES = [10, 25, 50, 100];
async function remindersScreen() {
  const sub = view.remindersSub || 'reminders';
  let cards = [];
  if (sub === 'reminders') {
    const { data: clientsData } = await supabase_client.rpc('coach_portal_reminder_data', { p_token: token });
    const { data: recentSent } = await supabase_client.rpc('coach_portal_recent_reminders', { p_token: token });
    const sentSet = new Set((recentSent || []).map(r => r.client_id + ':' + r.rule_key));
    (clientsData || []).forEach(c => {
      dueRulesFor(c).forEach(ruleKey => {
        if (sentSet.has(c.client_id + ':' + ruleKey)) return;
        const rule = REMINDER_RULES[ruleKey];
        const msg = rule.msg(c.client_name.split(' ')[0], (c.recent_adherence || []).length);
        cards.push({ label: rule.label, trigger: rule.trigger, name: c.client_name, msg, clientId: c.client_id, ruleKey, kind: 'reminder' });
      });
    });
  } else {
    const { data: celebData } = await supabase_client.rpc('coach_portal_celebration_data', { p_token: token });
    const { data: recentCeleb } = await supabase_client.rpc('coach_portal_recent_celebrations', { p_token: token });
    const sentSet = new Set((recentCeleb || []).map(r => r.client_id + ':' + r.celeb_key));
    (celebData || []).forEach(c => {
      const first = c.client_name.split(' ')[0];
      (c.recent_prs || []).forEach(pr => {
        const key = 'pr-' + pr.exercise.toLowerCase().replace(/\s+/g,'-');
        if (sentSet.has(c.client_id + ':' + key)) return;
        cards.push({ label: 'New PR', trigger: pr.exercise + ' — ' + pr.weight + ' lb', name: c.client_name,
          msg: `Hey ${first}, huge news — new PR on ${pr.exercise} at ${pr.weight} lb! All that work is paying off. Keep it up!`,
          clientId: c.client_id, ruleKey: key, kind: 'celeb' });
      });
      const milestone = CELEB_MILESTONES.filter(m => c.checkin_count >= m).pop();
      if (milestone) {
        const key = 'milestone-' + milestone;
        if (!sentSet.has(c.client_id + ':' + key)) {
          cards.push({ label: 'Check-In Milestone', trigger: milestone + ' total check-ins', name: c.client_name,
            msg: `Hey ${first}, you just hit ${milestone} check-ins with me — that kind of consistency is exactly what gets results. Really proud of you!`,
            clientId: c.client_id, ruleKey: key, kind: 'celeb' });
        }
      }
      if (c.weight_change_30d !== null && c.weight_change_30d <= -5) {
        const key = 'weightloss-30d';
        if (!sentSet.has(c.client_id + ':' + key)) {
          cards.push({ label: 'Progress Milestone', trigger: Math.abs(c.weight_change_30d).toFixed(1) + ' lb down in 30 days', name: c.client_name,
            msg: `Hey ${first}, you're down ${Math.abs(c.weight_change_30d).toFixed(1)} lb over the last 30 days — that's real progress. Awesome work!`,
            clientId: c.client_id, ruleKey: key, kind: 'celeb' });
        }
      }
    });
  }
  const cardsHtml = cards.map(c => `
    <div class="reminder-card">
      <div style="flex:1;">
        <div class="reminder-rule ${c.kind==='celeb'?'celeb':''}">${esc(c.label)}</div>
        <div class="name">${esc(c.name)}</div>
        <div class="meta">${esc(c.trigger)}</div>
        <div class="reminder-msg">${esc(c.msg)}</div>
      </div>
      <button class="btn btn-sm" data-send="${c.kind}" data-client="${c.clientId}" data-rule="${c.ruleKey}" data-msg="${escAttr(c.msg)}">Send</button>
    </div>
  `).join('');
  return `
    ${tabBar()}
    <h1>Reminders</h1>
    <div class="segrow" style="max-width:360px;">
      <button class="${sub==='reminders'?'sel':''}" data-sub="reminders">Reminders</button>
      <button class="${sub==='celebrations'?'sel':''}" data-sub="celebrations">Celebrations</button>
    </div>
    <div class="sub">${cards.length ? cards.length + ' item' + (cards.length===1?'':'s') + (sub==='reminders' ? ' due for a nudge' : ' worth celebrating') : (sub==='reminders' ? 'Everyone is on track — nothing due right now.' : 'Nothing to celebrate yet — check back after more check-ins and logged workouts.')}</div>
    <div class="card" style="padding:6px 20px;">
      ${cardsHtml || '<div class="empty">Nothing here right now.</div>'}
    </div>
  `;
}
function wireReminders() {
  wireTabBar();
  document.querySelectorAll('[data-sub]').forEach(btn => {
    btn.addEventListener('click', () => { view.remindersSub = btn.getAttribute('data-sub'); render(); });
  });
  document.querySelectorAll('[data-send]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const kind = btn.getAttribute('data-send');
      const clientId = btn.getAttribute('data-client');
      const ruleKey = btn.getAttribute('data-rule');
      const msg = btn.getAttribute('data-msg');
      const rpc = kind === 'celeb' ? 'coach_portal_send_celebration' : 'coach_portal_send_reminder';
      const params = kind === 'celeb'
        ? { p_token: token, p_client_id: clientId, p_celeb_key: ruleKey, p_message: msg }
        : { p_token: token, p_client_id: clientId, p_rule_key: ruleKey, p_message: msg };
      const { error } = await supabase_client.rpc(rpc, params);
      if (error) { toast('Error: ' + error.message); return; }
      await render();
      toast('Sent');
    });
  });
}

function syncWorkoutDraftFromDom() {
  document.querySelectorAll('[data-day-name]').forEach(el => { workoutDraft.days[+el.getAttribute('data-day-name')].name = el.value; });
  document.querySelectorAll('[data-day-cardio]').forEach(el => { workoutDraft.days[+el.getAttribute('data-day-cardio')].cardio = el.value; });
  document.querySelectorAll('[data-ex-name]').forEach(el => {
    const [di, ei] = el.getAttribute('data-ex-name').split(':').map(Number);
    workoutDraft.days[di].exercises[ei].name = el.value;
  });
  document.querySelectorAll('[data-ex-sets]').forEach(el => {
    const [di, ei] = el.getAttribute('data-ex-sets').split(':').map(Number);
    workoutDraft.days[di].exercises[ei].sets_reps = el.value;
  });
  const wn = document.getElementById('wName'), wt = document.getElementById('wTag'), ws = document.getElementById('wSummary');
  if (wn) workoutDraft.name = wn.value; if (wt) workoutDraft.tag = wt.value; if (ws) workoutDraft.summary = ws.value;
}
function syncMealDraftFromDom() {
  document.querySelectorAll('[data-meal-name]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-name')].name = el.value; });
  document.querySelectorAll('[data-meal-cal]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-cal')].calories = el.value; });
  document.querySelectorAll('[data-meal-protein]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-protein')].protein = el.value; });
  document.querySelectorAll('[data-meal-carbs]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-carbs')].carbs = el.value; });
  document.querySelectorAll('[data-meal-fat]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-fat')].fat = el.value; });
  document.querySelectorAll('[data-meal-items]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-items')].items_text = el.value; });
  document.querySelectorAll('[data-meal-recipe]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-recipe')].recipe = el.value; });
  document.querySelectorAll('[data-meal-steps]').forEach(el => { mealDraft.meals[+el.getAttribute('data-meal-steps')].steps = el.value.split('\n').map(s => s.trim()).filter(Boolean); });
  const mn = document.getElementById('mName'), mt = document.getElementById('mTag'), mc = document.getElementById('mCal'),
        mp = document.getElementById('mProtein'), mf = document.getElementById('mFat'), mcb = document.getElementById('mCarbs');
  if (mn) mealDraft.name = mn.value; if (mt) mealDraft.tag = mt.value; if (mc) mealDraft.calories = mc.value;
  if (mp) mealDraft.protein = mp.value; if (mf) mealDraft.fat = mf.value; if (mcb) mealDraft.carbs = mcb.value;
  if (!Array.isArray(mealDraft.swaps)) mealDraft.swaps = [];
  document.querySelectorAll('[data-swap-title]').forEach(el => { const gi = +el.getAttribute('data-swap-title'); if (mealDraft.swaps[gi]) mealDraft.swaps[gi].title = el.value; });
  document.querySelectorAll('[data-swap-note]').forEach(el => { const gi = +el.getAttribute('data-swap-note'); if (mealDraft.swaps[gi]) mealDraft.swaps[gi].note = el.value; });
  document.querySelectorAll('[data-swap-item-name]').forEach(el => { const [gi, ii] = el.getAttribute('data-swap-item-name').split(':').map(Number); if (mealDraft.swaps[gi] && mealDraft.swaps[gi].items[ii]) mealDraft.swaps[gi].items[ii].name = el.value; });
  document.querySelectorAll('[data-swap-item-amt]').forEach(el => { const [gi, ii] = el.getAttribute('data-swap-item-amt').split(':').map(Number); if (mealDraft.swaps[gi] && mealDraft.swaps[gi].items[ii]) mealDraft.swaps[gi].items[ii].amount = el.value; });
}
async function rerenderPrograms() {
  app.innerHTML = topBar() + `<div class="container">${await programsScreen()}</div>`;
  wirePrograms();
}
function wirePrograms() {
  wireTabBar();

    const { error } = await supabase_client.rpc('coach_portal_set_demo', { p_token: token, p_name: name, p_url: url });

    if (error) { toast('Error: ' + error.message); return; }
    await rerenderPrograms(); toast('Demo removed');
  }));
  const aiwb = document.getElementById('aiWorkoutBtn'); if (aiwb) aiwb.addEventListener('click', () => openAiModal('workout'));
  const aimb = document.getElementById('aiMealBtn'); if (aimb) aimb.addEventListener('click', () => openAiModal('meal'));
  document.getElementById('addDayBtn').addEventListener('click', () => {
    syncWorkoutDraftFromDom();
    workoutDraft.days.push({ name: 'Day ' + (workoutDraft.days.length + 1), cardio: '', exercises: [{ name: '', sets_reps: '' }] });
    rerenderPrograms();
  });
  document.querySelectorAll('[data-rm-day]').forEach(btn => btn.addEventListener('click', () => {
    syncWorkoutDraftFromDom();
    workoutDraft.days.splice(+btn.getAttribute('data-rm-day'), 1);
    rerenderPrograms();
  }));
  document.querySelectorAll('[data-add-ex]').forEach(btn => btn.addEventListener('click', () => {
    syncWorkoutDraftFromDom();
    workoutDraft.days[+btn.getAttribute('data-add-ex')].exercises.push({ name: '', sets_reps: '' });
    rerenderPrograms();
  }));
  document.querySelectorAll('[data-rm-ex]').forEach(btn => btn.addEventListener('click', () => {
    syncWorkoutDraftFromDom();
    const [di, ei] = btn.getAttribute('data-rm-ex').split(':').map(Number);
    workoutDraft.days[di].exercises.splice(ei, 1);
    rerenderPrograms();
  }));
  document.getElementById('addWorkoutBtn').addEventListener('click', async () => {
    syncWorkoutDraftFromDom();
    if (!workoutDraft.name.trim()) { toast('Workout name is required'); return; }
    const days = workoutDraft.days.map(d => ({ name: d.name, cardio: d.cardio, exercises: d.exercises.filter(e => e.name.trim()) }));
    const { error } = await supabase_client.rpc('coach_portal_add_workout', { p_token: token, p_name: workoutDraft.name.trim(), p_tag: workoutDraft.tag.trim(), p_summary: workoutDraft.summary.trim(), p_days: days });
    if (error) { toast('Error: ' + error.message); return; }
    workoutDraft = blankWorkoutDraft();
    await rerenderPrograms();
    toast('Workout split saved');
  });

  document.getElementById('addMealLineBtn').addEventListener('click', () => {
    syncMealDraftFromDom();
    mealDraft.meals.push({ name: '', calories: '', protein: '', fat: '', carbs: '', items_text: '' });
    rerenderPrograms();
  });
  document.querySelectorAll('[data-rm-meal]').forEach(btn => btn.addEventListener('click', () => {
    syncMealDraftFromDom();
    mealDraft.meals.splice(+btn.getAttribute('data-rm-meal'), 1);
    rerenderPrograms();
  }));
  document.querySelectorAll('[data-gen-meal]').forEach(btn => btn.addEventListener('click', async () => {
    syncMealDraftFromDom();
    const mi = +btn.getAttribute('data-gen-meal');
    const m = mealDraft.meals[mi];
    if (!m || !m.name.trim()) { toast('Give the meal a name first'); return; }
    const orig = btn.textContent; btn.disabled = true; btn.textContent = 'Generating… (~15s)';
    try {
      const { data, error } = await supabase_client.functions.invoke('generate-meal-detail', { body: { meal: m } });
      if (error || (data && data.error)) { toast('Error: ' + (error ? error.message : data.error)); btn.disabled = false; btn.textContent = orig; return; }
      if (data) { if (data.recipe) m.recipe = data.recipe; if (Array.isArray(data.steps) && data.steps.length) m.steps = data.steps; if (data.photo_url) m.photo_url = data.photo_url; }
      rerenderPrograms();
      toast('Recipe + photo added');
    } catch (e) { toast('Error generating'); btn.disabled = false; btn.textContent = orig; }
  }));
  document.getElementById('autoGenBtn').addEventListener('click', () => {
    syncMealDraftFromDom();
    const cal = Number(mealDraft.calories) || 2000, pro = Number(mealDraft.protein) || 150, fat = Number(mealDraft.fat) || 60, carb = Number(mealDraft.carbs) || 200;
    const names = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
    const splits = [0.25, 0.35, 0.3, 0.1];
    mealDraft.meals = names.map((n, i) => ({
      name: n, calories: Math.round(cal * splits[i]), protein: Math.round(pro * splits[i]),
      fat: Math.round(fat * splits[i]), carbs: Math.round(carb * splits[i]), items_text: ''
    }));
    rerenderPrograms();
    toast('Auto-generated 4 meals from your macro targets');
  });
  const ppBtn = document.getElementById('pastePlanBtn');
  if (ppBtn) ppBtn.addEventListener('click', () => { syncMealDraftFromDom(); openPastePlanModal(); });
  const gapBtn = document.getElementById('genAllPhotosBtn');

  document.getElementById('addSwapGroupBtn').addEventListener('click', () => {
    syncMealDraftFromDom();
    if (!Array.isArray(mealDraft.swaps)) mealDraft.swaps = [];
    const title = mealDraft.swaps.length === 0 ? 'Protein swaps' : (mealDraft.swaps.length === 1 ? 'Carb swaps' : '');
    mealDraft.swaps.push({ title, note: '', items: [{ name: '', amount: '' }] });
    rerenderPrograms();
  });
  document.querySelectorAll('[data-rm-swap]').forEach(btn => btn.addEventListener('click', () => {
    syncMealDraftFromDom();
    mealDraft.swaps.splice(+btn.getAttribute('data-rm-swap'), 1);
    rerenderPrograms();
  }));
  document.querySelectorAll('[data-add-swap-item]').forEach(btn => btn.addEventListener('click', () => {
    syncMealDraftFromDom();
    mealDraft.swaps[+btn.getAttribute('data-add-swap-item')].items.push({ name: '', amount: '' });
    rerenderPrograms();
  }));
  document.querySelectorAll('[data-rm-swap-item]').forEach(btn => btn.addEventListener('click', () => {

async function runAiGenerate(kind) {

    if (data && data.error) { status.textContent = data.error; btn.disabled = false; return; }
    const plan = data && data.plan;

    if (kind === 'meal') {
      mealDraft = {
        name: plan.name || '', tag: plan.tag || '',
        calories: plan.calories || '', protein: plan.protein || '', fat: plan.fat || '', carbs: plan.carbs || '',
        meals: (Array.isArray(plan.meals) ? plan.meals : []).map(m => ({ name: m.name||'', calories: m.calories||'', protein: m.protein||'', fat: m.fat||'', carbs: m.carbs||'', items_text: m.items_text||'' })),
        swaps: (Array.isArray(plan.swaps) ? plan.swaps : []).map(g => ({ title: g.title||'', note: g.note||'', items: (Array.isArray(g.items) ? g.items : []).map(it => ({ name: it.name||'', amount: it.amount||'' })) }))
      };
    } else {
      const days = (Array.isArray(plan.days) && plan.days.length) ? plan.days : [{ name: 'Day 1', cardio: '', exercises: [{ name: '', sets_reps: '' }] }];
      workoutDraft = {
        name: plan.name || '', tag: plan.tag || '', summary: plan.summary || '',
        days: days.map(d => ({
          name: d.name || '', cardio: d.cardio || '',
          exercises: (Array.isArray(d.exercises) && d.exercises.length ? d.exercises : [{ name: '', sets_reps: '' }]).map(e => ({ name: e.name || '', sets_reps: e.sets_reps || '' }))

  } catch (e) {

/* ================= ROSTER ================= */
function statusFor(c) {
  if (c.checkin_count === 0) {
    return c.account_status === 'active' ? { label:'Awaiting check-in', cls:'muted' } : { label:'Invited', cls:'warn' };
  }
  const age = daysAgo(c.last_checkin_date);
  if (age === null) return { label:'Awaiting check-in', cls:'muted' };
  if (age >= 14) return { label:'Overdue', cls:'critical' };
  if (age >= 9) return { label:'Slipping', cls:'warn' };
  return { label:'On track', cls:'good' };
}
function miniSpark(points) {
  const pts = (points || []).map(p => Number(p.weight)).filter(v => !isNaN(v));
  const w = 74, h = 30;
  if (pts.length < 2) return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="2" y1="${h/2}" x2="${w-2}" y2="${h/2}" stroke="var(--border)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4"/></svg>`;
  const min = Math.min(...pts), max = Math.max(...pts), range = (max - min) || 1;
  const stepX = (w - 4) / (pts.length - 1);
  const down = pts[pts.length-1] <= pts[0];
  const color = down ? 'var(--good)' : 'var(--critical)';
  const coords = pts.map((v, i) => [2 + i * stepX, h - 5 - ((v - min) / range) * (h - 10)]);
  const path = coords.map((c, i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function trendCell(c) {
  const pts = (c.weight_points || []).map(p => Number(p.weight)).filter(v => !isNaN(v));
  let delta = '';
  if (pts.length >= 2) {
    const d = pts[pts.length-1] - pts[0];
    const cls = d < 0 ? 'good' : (d > 0 ? 'bad' : 'flat');
    delta = `<span class="delta ${cls}">${d>0?'+':''}${d.toFixed(1)} lb</span>`;
  } else {
    delta = `<span class="delta flat">—</span>`;
  }
  return `<div class="trend">${miniSpark(c.weight_points)}${delta}</div>`;
}
function computeStats(list) {
  const total = list.length;
  const active = list.filter(c => c.account_status === 'active');
  const brandNew = list.filter(c => (c.checkin_count || 0) === 0).length;
  const pending = list.filter(c => c.account_status !== 'active').length;
  const checkedIn8 = active.filter(c => { const d = daysAgo(c.last_checkin_date); return d !== null && d <= 8; }).length;
  const checkedInWeek = list.filter(c => { const d = daysAgo(c.last_checkin_date); return d !== null && d <= 7; }).length;
  const needsAttention = active.filter(c => { const d = daysAgo(c.last_checkin_date); return d === null || d >= 9; }).length;
  const adh = list.map(c => c.last_adherence).filter(a => a !== null && a !== undefined);
  const avgAdh = adh.length ? (adh.reduce((s,a)=>s+a,0)/adh.length) : null;
  return { total, activeCount: active.length, brandNew, pending, checkedIn8, checkedInWeek, needsAttention, avgAdh };
}

function wireRosterRows() {
  const OPEN = -104;
  document.querySelectorAll('.swipe-wrap').forEach(wrap => {
    const row = wrap.querySelector('.roster-row');
    const id = row.getAttribute('data-open');
    let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false, moved = false;
    const base = () => (wrap.classList.contains('open') ? OPEN : 0);
    const setX = v => { row.style.transform = 'translateX(' + v + 'px)'; };
    row.addEventListener('touchstart', e => {
      const t = e.touches[0]; startX = t.clientX; startY = t.clientY;
      dx = base(); dragging = true; decided = false; horizontal = false; moved = false;
      row.style.transition = 'none';
    }, { passive: true });
    row.addEventListener('touchmove', e => {
      if (!dragging) return;
      const t = e.touches[0];
      const mx = t.clientX - startX, my = t.clientY - startY;
      if (!decided) {
        if (Math.abs(mx) < 6 && Math.abs(my) < 6) return;
        decided = true; horizontal = Math.abs(mx) > Math.abs(my);
      }
      if (!horizontal) return;
      moved = true;
      dx = Math.max(OPEN, Math.min(0, base() + mx));
      setX(dx);
    }, { passive: true });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      row.style.transition = '';
      if (horizontal) {
        const open = dx < OPEN / 2;
        wrap.classList.toggle('open', open);
        row.style.transform = '';
      }
    };
    row.addEventListener('touchend', end);
    row.addEventListener('touchcancel', end);
    row.addEventListener('click', e => {
      if (moved || wrap.classList.contains('open')) {
        e.preventDefault(); moved = false;
        if (wrap.classList.contains('open')) wrap.classList.remove('open');
        return;
      }
      view.screen = 'detail'; view.clientId = id; view.detailTab = 'overview'; render();
    });
  });
  document.querySelectorAll('[data-archive]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      archiveClient(btn.getAttribute('data-archive'), btn.getAttribute('data-name'));
    });
  });
}

function sparklineSvg(points, w, h) {
  if (points.length < 2) return '<div class="empty" style="padding:10px;">Not enough data for a chart yet.</div>';
  const vals = points.map(p => p.weight);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = w / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = i * stepX;
    const y = h - ((p.weight - min) / range) * (h - 16) - 8;
    return [x, y];
  });
  const path = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--accent-strong)" />`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="none" style="overflow:visible;">
    <path d="${path}" fill="none" stroke="var(--accent-strong)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
    ${dots}
  </svg>`;
}
function parseMealsFromText(text) {
  const blocks = String(text || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = [];
  blocks.forEach(block => {
    const lines = block.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return;
    let name = lines[0], inlineItems = '';
    const sep = name.match(/^(.*?)[:\-–—]\s*(.*)$/);
    if (sep) { name = sep[1].trim(); if (sep[2]) inlineItems = sep[2].trim(); }
    let work = ' ' + block.replace(/\n/g, ' ') + ' ';
    const grab = (re) => { const m = work.match(re); if (m) { work = work.replace(re, ' '); return m[1]; } return ''; };
    const calories = grab(/(\d+(?:\.\d+)?)\s*(?:kcal|cals?|calories)\b/i);
    const protein = grab(/(\d+(?:\.\d+)?)\s*g?\s*(?:protein|pro|p)\b/i);
    const carbs = grab(/(\d+(?:\.\d+)?)\s*g?\s*(?:carbs?|carb|c)\b/i);
    const fat = grab(/(\d+(?:\.\d+)?)\s*g?\s*(?:fat|f)\b/i);
    const itemLines = [];
    if (inlineItems) itemLines.push(inlineItems);
    for (let i = 1; i < lines.length; i++) {
      const L = lines[i];
      const stripped = L.replace(/(\d+(?:\.\d+)?)\s*g?\s*(?:kcal|cals?|calories|protein|pro|carbs?|carb|fat|p|c|f)\b/ig, '').replace(/[,·|\-–—]/g, '').trim();
      if (stripped.length >= 3) itemLines.push(L);
    }
    const items = itemLines.join(', ').replace(/\s*,\s*,\s*/g, ', ').trim();
    if (name) out.push({ name: name.slice(0, 60), items_text: items, calories: calories || '', protein: protein || '', carbs: carbs || '', fat: fat || '' });
  });
  return out;
}

/* ================= PROGRESS PHOTO VIEWER (full screen + compare) ================= */
function fmtPhotoDate(d) {
  try { return new Date(d + 'T00:00:00').toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch (e) { return d; }
}
function daysBetween(a, b) {
  try {
    const ms = Math.abs(new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00'));
    return Math.round(ms / 86400000);
  } catch (e) { return null; }
}
function closePhotoViewer() {
  photoViewerHost.innerHTML = '';
  document.removeEventListener('keydown', photoViewerKey);
}
function photoViewerKey(e) {
  const host = photoViewerHost.firstElementChild;
  if (!host) return;
  if (e.key === 'Escape') { closePhotoViewer(); return; }
  const cur = host.getAttribute('data-single-idx');
  if (cur === null || cur === undefined) return;
  const i = Number(cur);
  if (e.key === 'ArrowLeft' && i > 0) renderPhotoSingle(i - 1);
  if (e.key === 'ArrowRight' && i < progressPhotos.length - 1) renderPhotoSingle(i + 1);
}
function openPhotoViewer(idx) {
  document.addEventListener('keydown', photoViewerKey);
  renderPhotoSingle(idx);
}
function renderPhotoSingle(idx) {
  const p = progressPhotos[idx];
  if (!p) return;
  const total = progressPhotos.length;
  photoViewerHost.innerHTML = `
    <div class="pv-overlay" data-single-idx="${idx}">
      <div class="pv-top">
        <div class="pv-title">Progress Photo · ${idx + 1} of ${total}</div>
        <div class="pv-actions">
          ${total >= 2 ? `<button class="pv-btn" id="pvCompareFromSingle">Compare</button>` : ''}
          <button class="pv-x" data-pv-close aria-label="Close">×</button>
        </div>
      </div>
      <div class="pv-stage" data-pv-close-bg>
        ${idx > 0 ? `<button class="pv-nav prev" id="pvPrev" aria-label="Previous">‹</button>` : ''}
        <img src="${p.storage_path}" alt="progress photo ${p.date}">
        ${idx < total - 1 ? `<button class="pv-nav next" id="pvNext" aria-label="Next">›</button>` : ''}
      </div>
      <div class="pv-caption"><b>${fmtPhotoDate(p.date)}</b>${p.note ? ' · ' + esc(p.note) : ''}</div>
    </div>`;
  photoViewerHost.querySelectorAll('[data-pv-close]').forEach(el => el.addEventListener('click', closePhotoViewer));
  const bg = photoViewerHost.querySelector('[data-pv-close-bg]');
  if (bg) bg.addEventListener('click', e => { if (e.target === bg) closePhotoViewer(); });
  const prev = document.getElementById('pvPrev');
  if (prev) prev.addEventListener('click', () => renderPhotoSingle(idx - 1));
  const next = document.getElementById('pvNext');
  if (next) next.addEventListener('click', () => renderPhotoSingle(idx + 1));
  const cmp = document.getElementById('pvCompareFromSingle');
  if (cmp) cmp.addEventListener('click', () => {
    // compare this photo against the next-oldest one by default (or the previous if it's the oldest)
    const other = idx < total - 1 ? idx + 1 : idx - 1;
    openCompare(idx, other);
  });
}
function openCompare(a, b) {
  const pa = progressPhotos[a], pb = progressPhotos[b];
  if (!pa || !pb) return;
  // show older on the left, newer on the right
  let left = pa, right = pb;
  if (new Date(pa.date) > new Date(pb.date)) { left = pb; right = pa; }
  const gap = daysBetween(left.date, right.date);
  const gapTxt = gap != null && gap > 0 ? `<span class="delta">+${gap} day${gap === 1 ? '' : 's'} apart</span>` : '';
  document.addEventListener('keydown', photoViewerKey);
  photoViewerHost.innerHTML = `
    <div class="pv-overlay">
      <div class="pv-top">
        <div class="pv-title">Compare</div>
        <div class="pv-actions">
          <button class="pv-x" data-pv-close aria-label="Close">×</button>
        </div>
      </div>
      <div class="pv-compare">
        <div class="pv-pane">
          <div class="pv-img-wrap"><img src="${left.storage_path}" alt="progress photo ${left.date}"></div>
          <div class="pv-pane-cap"><b>${fmtPhotoDate(left.date)}</b><br>Earlier</div>
        </div>
        <div class="pv-pane">
          <div class="pv-img-wrap"><img src="${right.storage_path}" alt="progress photo ${right.date}"></div>
          <div class="pv-pane-cap"><b>${fmtPhotoDate(right.date)}</b><br>Later ${gapTxt}</div>
        </div>
      </div>
      <div class="pv-caption">Tap the ✕ to close · pick two dates from the strip to compare others.</div>
    </div>`;
  photoViewerHost.querySelectorAll('[data-pv-close]').forEach(el => el.addEventListener('click', closePhotoViewer));
}
function resetCompareMode() {
  compareSelect = null;
  const btn = document.getElementById('comparePhotosBtn');
  if (btn) btn.textContent = 'Compare';
  const hint = document.getElementById('photoHint');
  if (hint) hint.textContent = 'Tap a photo to view it full screen.';
  document.querySelectorAll('[data-photo-idx]').forEach(el => el.classList.remove('cmp-pick', 'cmp-chosen'));
}
function wirePhotos() {
  const imgs = document.querySelectorAll('[data-photo-idx]');
  if (!imgs.length) return;
  const cmpBtn = document.getElementById('comparePhotosBtn');
  const hint = document.getElementById('photoHint');
  if (cmpBtn) cmpBtn.addEventListener('click', () => {
    if (compareSelect === null) {
      compareSelect = [];
      cmpBtn.textContent = 'Cancel';
      if (hint) hint.textContent = 'Select two photos to compare.';
      document.querySelectorAll('[data-photo-idx]').forEach(el => el.classList.add('cmp-pick'));
    } else {
      resetCompareMode();
    }
  });
  imgs.forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.getAttribute('data-photo-idx'));
      if (compareSelect === null) { openPhotoViewer(idx); return; }
      const pos = compareSelect.indexOf(idx);
      if (pos >= 0) { compareSelect.splice(pos, 1); el.classList.remove('cmp-chosen'); if (hint) hint.textContent = 'Select two photos to compare.'; return; }
      if (compareSelect.length >= 2) return;
      compareSelect.push(idx);
      el.classList.add('cmp-chosen');
      if (compareSelect.length === 1 && hint) hint.textContent = '1 selected · pick one more.';
      if (compareSelect.length === 2) {
        const pair = compareSelect.slice();
        resetCompareMode();
        openCompare(pair[0], pair[1]);
      }
    });
  });
}

function wireDetail() {
  document.getElementById('backBtn').addEventListener('click', () => { view.screen = 'roster'; view.clientId = null; render(); });
  wirePhotos();
  document.querySelectorAll('[data-dtab]').forEach(btn => {
    btn.addEventListener('click', () => { view.detailTab = btn.getAttribute('data-dtab'); msgDraft = ''; render(); });
  });
  const addHabitBtn = document.getElementById('addHabitBtn');
  if (addHabitBtn) addHabitBtn.addEventListener('click', async () => {
    const name = document.getElementById('habitName').value.trim();
    const target = document.getElementById('habitTarget').value;
    const unit = document.getElementById('habitUnit').value.trim();
    if (!name) { toast('Enter a habit name'); return; }
    const { error } = await supabase_client.rpc('coach_portal_add_habit', { p_token: token, p_client_id: view.clientId, p_name: name, p_target: target === '' ? null : Number(target), p_unit: unit || null, p_frequency: 'daily' });
    if (error) { toast('Error: ' + error.message); return; }
    await render(); toast('Habit added');
  });
  document.querySelectorAll('[data-rm-habit]').forEach(b => b.addEventListener('click', async () => {
    const { error } = await supabase_client.rpc('coach_portal_remove_habit', { p_token: token, p_habit_id: b.getAttribute('data-rm-habit') });
    if (error) { toast('Error: ' + error.message); return; }
    await render(); toast('Habit removed');
  }));
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) copyBtn.addEventListener('click', () => {
    const el = document.getElementById('inviteInput');
    el.select();
    navigator.clipboard?.writeText(el.value).catch(() => document.execCommand('copy'));
    toast('Invite link copied');
  });
  const textInviteBtn = document.getElementById('textInviteBtn');

    const client = clients.find(c => c.id === view.clientId);

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const sep = isIOS ? '&' : '?';
    window.location.href = `sms:${client.phone}${sep}body=${encodeURIComponent(msg)}`;
  });
  const saveShowBtn = document.getElementById('saveShowBtn');
  if (saveShowBtn) saveShowBtn.addEventListener('click', async () => {
    const sd = document.getElementById('showDate').value || null;
    const { error } = await supabase_client.rpc('coach_portal_set_show_date', { p_token: token, p_client_id: view.clientId, p_show_date: sd });
    if (error) { toast('Error: ' + error.message); return; }
    await render();
    toast(sd ? 'Show date saved' : 'Show date cleared');
  });
  const saveMacBtn = document.getElementById('saveMacBtn');
  if (saveMacBtn) saveMacBtn.addEventListener('click', async () => {
    const n = id => { const v = document.getElementById(id).value; return v === '' ? null : Number(v); };
    const note = document.getElementById('macNote').value.trim();
    if (n('macCal') == null && n('macPro') == null && n('macCarb') == null && n('macFat') == null) { toast('Enter at least one macro'); return; }
    const { error } = await supabase_client.rpc('coach_portal_set_macros', { p_token: token, p_client_id: view.clientId, p_calories: n('macCal'), p_protein: n('macPro'), p_carbs: n('macCarb'), p_fat: n('macFat'), p_note: note });
    if (error) { toast('Error: ' + error.message); return; }
    await render(); toast('Macros logged');
  });
  document.querySelectorAll('[data-rm-macro]').forEach(b => b.addEventListener('click', async () => {
    const { error } = await supabase_client.rpc('coach_portal_remove_macros', { p_token: token, p_macro_id: b.getAttribute('data-rm-macro') });
    if (error) { toast('Error: ' + error.message); return; }
    await render(); toast('Entry removed');
  }));
  const saveAssignBtn = document.getElementById('saveAssignBtn');
  if (saveAssignBtn) saveAssignBtn.addEventListener('click', async () => {
    const workoutId = document.getElementById('assignWorkout').value || null;
    const mealId = document.getElementById('assignMeal').value || null;
    const { error } = await supabase_client.rpc('coach_portal_assign_programs', { p_token: token, p_client_id: view.clientId, p_workout_id: workoutId, p_meal_plan_id: mealId });
    if (error) { toast('Error: ' + error.message); return; }
    await render();
    toast('Programs assigned');
  });
  const saveBillBtn = document.getElementById('saveBillBtn');
  if (saveBillBtn) saveBillBtn.addEventListener('click', async () => {
    const amount = document.getElementById('bAmount').value;
    const term = document.getElementById('bTerm').value;
    const start = document.getElementById('bStart').value;
    const end = document.getElementById('bEnd').value;
    if (!amount || !start || !end) { toast('Fill in amount, start, and end date'); return; }
    const { error } = await supabase_client.rpc('coach_portal_set_billing', { p_token: token, p_client_id: view.clientId, p_term: term, p_amount: Number(amount), p_start: start, p_end: end });
    if (error) { toast('Error: ' + error.message); return; }
    await render();
    toast('Billing saved');
  });
  const pdfInput = document.getElementById('pdfInput');
  const pdfUploadBtn = document.getElementById('pdfUploadBtn');
  const pdfDrop = document.getElementById('pdfDrop');
  async function uploadPdfFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) { toast('Please choose a PDF file'); return; }
    const st = document.getElementById('pdfStatus'); if (st) st.textContent = 'Uploading…';
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(file); });
      const { data, error } = await supabase_client.functions.invoke('set-meal-pdf', { body: { token, client_id: view.clientId, file_base64: b64, file_name: file.name } });
      if (error || (data && data.error)) { if (st) st.textContent = 'Error: ' + (error ? error.message : data.error); return; }
      await render();
      toast('Meal plan PDF uploaded');
    } catch (e) { if (st) st.textContent = 'Error: ' + (e && e.message ? e.message : String(e)); }
  }
  if (pdfUploadBtn) pdfUploadBtn.addEventListener('click', () => pdfInput.click());
  if (pdfDrop) pdfDrop.addEventListener('click', () => pdfInput.click());
  if (pdfInput) pdfInput.addEventListener('change', () => uploadPdfFile(pdfInput.files[0]));
  if (pdfDrop) {
    ['dragover','dragenter'].forEach(ev => pdfDrop.addEventListener(ev, e => { e.preventDefault(); pdfDrop.style.borderColor = 'var(--accent)'; }));
    ['dragleave','dragend'].forEach(ev => pdfDrop.addEventListener(ev, e => { e.preventDefault(); pdfDrop.style.borderColor = 'var(--border)'; }));
    pdfDrop.addEventListener('drop', e => { e.preventDefault(); pdfDrop.style.borderColor = 'var(--border)'; if (e.dataTransfer && e.dataTransfer.files[0]) uploadPdfFile(e.dataTransfer.files[0]); });
  }
  const pdfRemoveBtn = document.getElementById('pdfRemoveBtn');
  if (pdfRemoveBtn) pdfRemoveBtn.addEventListener('click', async () => {
    if (!confirm('Remove this meal plan PDF?')) return;
    const { data, error } = await supabase_client.functions.invoke('set-meal-pdf', { body: { token, client_id: view.clientId, remove: true } });
    if (error || (data && data.error)) { toast('Error removing PDF'); return; }
    await render();
    toast('Meal plan PDF removed');
  });
  const pdfInputW = document.getElementById('pdfInputW');
  const pdfUploadBtnW = document.getElementById('pdfUploadBtnW');
  const pdfDropW = document.getElementById('pdfDropW');
  async function uploadWorkoutPdfFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) { toast('Please choose a PDF file'); return; }
    const st = document.getElementById('pdfStatusW'); if (st) st.textContent = 'Uploading…';
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(file); });
      const { data, error } = await supabase_client.functions.invoke('set-workout-pdf', { body: { token, client_id: view.clientId, file_base64: b64, file_name: file.name } });
      if (error || (data && data.error)) { if (st) st.textContent = 'Error: ' + (error ? error.message : data.error); return; }
      await render();
      toast('Workout plan PDF uploaded');
    } catch (e) { if (st) st.textContent = 'Error: ' + (e && e.message ? e.message : String(e)); }
  }
  if (pdfUploadBtnW) pdfUploadBtnW.addEventListener('click', () => pdfInputW.click());
  if (pdfDropW) pdfDropW.addEventListener('click', () => pdfInputW.click());
  if (pdfInputW) pdfInputW.addEventListener('change', () => uploadWorkoutPdfFile(pdfInputW.files[0]));
  if (pdfDropW) {
    ['dragover','dragenter'].forEach(ev => pdfDropW.addEventListener(ev, e => { e.preventDefault(); pdfDropW.style.borderColor = 'var(--accent)'; }));
    ['dragleave','dragend'].forEach(ev => pdfDropW.addEventListener(ev, e => { e.preventDefault(); pdfDropW.style.borderColor = 'var(--border)'; }));
    pdfDropW.addEventListener('drop', e => { e.preventDefault(); pdfDropW.style.borderColor = 'var(--border)'; if (e.dataTransfer && e.dataTransfer.files[0]) uploadWorkoutPdfFile(e.dataTransfer.files[0]); });
  }
  const pdfRemoveBtnW = document.getElementById('pdfRemoveBtnW');
  if (pdfRemoveBtnW) pdfRemoveBtnW.addEventListener('click', async () => {
    if (!confirm('Remove this workout plan PDF?')) return;
    const { data, error } = await supabase_client.functions.invoke('set-workout-pdf', { body: { token, client_id: view.clientId, remove: true } });
    if (error || (data && data.error)) { toast('Error removing PDF'); return; }
    await render();
    toast('Workout plan PDF removed');
  });
  const msgInput = document.getElementById('msgInput');
  if (msgInput) msgInput.addEventListener('input', e => { msgDraft = e.target.value; });
  const sendMsgBtn = document.getElementById('sendMsgBtn');
  if (sendMsgBtn) sendMsgBtn.addEventListener('click', async () => {
    if (!msgDraft.trim()) return;
    const { error } = await supabase_client.rpc('coach_portal_send_message', { p_token: token, p_client_id: view.clientId, p_text: msgDraft.trim() });
    if (error) { toast('Error: ' + error.message); return; }
    msgDraft = '';
    await render();
  });
  const dmThread = document.getElementById('dmThread');
  if (dmThread) dmThread.addEventListener('click', async (e) => {
    const lc = e.target.closest('[data-likers-msg]');
    if (lc) { const m = (window.__dmMsgs || []).find(x => String(x.id) === lc.getAttribute('data-likers-msg')); showLikers(m && m.likers); return; }
    const b = e.target.closest('[data-like-msg]'); if (!b) return;
    try { await supabase_client.rpc('coach_portal_toggle_message_like', { p_token: token, p_message_id: b.getAttribute('data-like-msg') }); await render(); }
    catch (err) { toast('Error'); }
  });
}

boot();
